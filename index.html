<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 28px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.panel {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.main-title {
  font-size: clamp(42px, 8vw, 90px);
  margin: 0 0 14px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 16px;
  margin-bottom: 40px;
}

.selection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  max-width: 850px;
  margin: 0 auto;
}

.big-button {
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 18px;
  background: #141414;
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  transition: 0.15s;
}

.big-button:hover {
  background: #222;
  border-color: #888;
}

.big-button:active {
  transform: scale(0.97);
  background: #333;
}

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topbar h2 {
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(28px, 5vw, 50px);
}

.back-button {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid #555;
  color: #fff;
  background: #151515;
  font-weight: 700;
}

.back-button:active {
  transform: scale(0.97);
}

.section {
  background: #111;
  border: 1px solid #2c2c2c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 16px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.text-input,
.number-input,
.select-input {
  min-height: 52px;
  padding: 10px 14px;
  background: #050505;
  border: 1px solid #444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #aaa;
}

.action-button {
  min-height: 52px;
  padding: 10px 20px;
  background: #1c1c1c;
  border: 1px solid #555;
  color: white;
  border-radius: 10px;
  font-weight: 800;
}

.action-button:active {
  transform: scale(0.97);
  background: #333;
}

.danger-button {
  border-color: #722;
  color: #ffb0b0;
}

.primary-button {
  background: #f5f5f5;
  color: #000;
  border-color: #fff;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-header {
  text-align: center;
  margin-bottom: 30px;
}

.staff-header h1 {
  font-size: clamp(34px, 6vw, 62px);
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.staff-header p {
  color: #999;
}

.player-editor-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.staff-player {
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 220px)
    auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 14px;
  border-radius: 12px;
}

.staff-player-name {
  font-size: 20px;
  font-weight: 800;
}

.coin-label {
  color: #aaa;
  font-size: 13px;
}

.throw-result {
  color: #ddd;
  font-size: 13px;
}

.coin-total {
  font-size: 30px;
  font-weight: 900;
  margin-top: 8px;
}

.rule-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.rule-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

/* =========================================================
   入出力デバイス選択
========================================================= */

.device-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}

.device-button {
  min-height: 190px;
  background: #121212;
  border: 1px solid #444;
  border-radius: 18px;
  color: #fff;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
}

.device-button:active {
  transform: scale(0.97);
  background: #292929;
}

/* =========================================================
   入力画面
========================================================= */

.input-layout {
  display: grid;
  grid-template-columns:
    minmax(320px, 1fr)
    minmax(280px, 420px);
  gap: 25px;
  align-items: start;
}

.board-container {
  width: min(760px, 100%);
  margin: 0 auto;
  position: relative;
  touch-action: none;
}

.board-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  user-select: none;
}

.board-hit {
  cursor: pointer;
}

.board-hit:hover {
  opacity: 0.85;
}

.current-info {
  background: #101010;
  border: 1px solid #303030;
  border-radius: 15px;
  padding: 18px;
  position: sticky;
  top: 10px;
}

.current-player-label {
  color: #aaa;
  font-size: 14px;
}

.current-player {
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 900;
  margin: 3px 0 12px;
}

.current-score {
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  line-height: 0.9;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.throw-count {
  font-size: 20px;
  margin-top: 15px;
  color: #ddd;
}

.staff-select-box {
  margin-bottom: 15px;
}

.staff-select-box label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.staff-select {
  width: 100%;
  min-height: 50px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #050505;
  color: #fff;
}

.player-controls {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.player-controls button {
  min-height: 52px;
}

.sound-control {
  margin-top: 18px;
}

.sound-control label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.sound-control input {
  width: 100%;
}

.undo-button {
  width: 100%;
  margin-top: 8px;
}

.player-list-box {
  margin-top: 20px;
}

.player-list-title {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 8px;
}

.input-player-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
}

.input-player-row {
  display: grid;
  grid-template-columns: 35px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border: 1px solid #292929;
  background: #090909;
  border-radius: 8px;
}

.input-player-row.current {
  border-color: #d8b400;
  box-shadow: 0 0 10px rgba(255, 220, 0, 0.25);
}

.input-player-number {
  color: #777;
  font-weight: 900;
}

.input-player-name {
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.input-player-score {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: 23px;
  font-weight: 900;
}

/* =========================================================
   外れボタン
========================================================= */

.miss-button {
  position: absolute;
  left: 3%;
  bottom: 3%;
  width: 120px;
  min-height: 62px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #151515;
  color: #fff;
  font-size: 20px;
  font-weight: 900;
  z-index: 20;
}

.miss-button:active {
  transform: scale(0.95);
  background: #333;
}

/* =========================================================
   ヒット演出
========================================================= */

.hit-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.hit-effect.active {
  animation: hitFlash 0.65s ease-out;
}

.hit-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(80px, 18vw, 220px);
  font-weight: 900;
  text-shadow:
    0 0 15px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.4);
}

@keyframes hitFlash {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  20% {
    opacity: 1;
    transform: scale(1.1);
  }

  55% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.4);
  }
}

/* =========================================================
   PLAYER CHANGE
========================================================= */

.player-change-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1100;
  opacity: 0;
}

.player-change-effect.active {
  animation: playerChangeFlash 1.2s ease-out;
}

.player-change-text {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(55px, 12vw, 150px);
  font-weight: 900;
  letter-spacing: 0.04em;
  text-shadow:
    0 0 20px rgba(255,255,255,.8),
    0 0 60px rgba(255,255,255,.5);
}

@keyframes playerChangeFlash {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }

  20% {
    opacity: 1;
    transform: scale(1.05);
  }

  65% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.15);
  }
}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
  padding: 0;
  background: #050505;
  overflow: hidden;
}

.output-layout {
  height: 100vh;
  min-height: 600px;
  display: grid;
  grid-template-rows: 40% 60%;
}

.current-display {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-bottom: 2px solid #292929;
  overflow: hidden;
}

.current-display::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid transparent;
  pointer-events: none;
}

.current-display.player-change::before {
  animation: currentBorder 1.3s ease-out;
}

@keyframes currentBorder {
  0% {
    border-color: #fff;
  }

  100% {
    border-color: transparent;
  }
}

.output-board-name {
  position: absolute;
  top: 12px;
  left: 20px;
  color: #777;
  font-size: 14px;
  letter-spacing: 0.15em;
}

.output-player-name {
  font-size: clamp(30px, 5vw, 70px);
  font-weight: 900;
  margin-bottom: 5px;
}

.output-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;
  font-weight: 900;
  font-size: clamp(100px, 18vw, 250px);
  line-height: 0.9;
  letter-spacing: -0.04em;
}

.output-throws {
  margin-top: 10px;
  font-size: clamp(20px, 3vw, 38px);
  color: #ddd;
  font-weight: 700;
}

.other-players {
  padding: 15px 20px 25px;
  overflow-y: auto;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  align-content: start;
  gap: 12px;
}

.other-player-card {
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 12px;
  padding: 16px 18px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.other-player-card.current {
  border-color: #d6b300;
  box-shadow:
    0 0 12px rgba(255, 220, 0, .35),
    inset 0 0 12px rgba(255, 220, 0, .06);
  animation: currentPlayerGlow 1.6s ease-in-out infinite alternate;
}

@keyframes currentPlayerGlow {
  from {
    box-shadow:
      0 0 8px rgba(255, 220, 0, .25),
      inset 0 0 8px rgba(255, 220, 0, .04);
  }

  to {
    box-shadow:
      0 0 24px rgba(255, 220, 0, .65),
      inset 0 0 16px rgba(255, 220, 0, .1);
  }
}

.other-player-name {
  color: #bbb;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.other-player-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    Georgia,
    serif;
  font-size: 45px;
  font-weight: 900;
  line-height: 1;
  margin-top: 5px;
}

.other-player-throws {
  color: #aaa;
  font-size: 14px;
  margin-top: 6px;
}

/* =========================================================
   ランキング
========================================================= */

.ranking-screen {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: #050505;
  padding: 30px;
  overflow-y: auto;
}

.ranking-panel {
  width: min(1000px, 100%);
  margin: 0 auto;
}

.ranking-title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(45px, 8vw, 90px);
  font-weight: 900;
  margin: 20px 0 8px;
  letter-spacing: .08em;
}

.ranking-subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 30px;
}

.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 90px 1fr 180px;
  align-items: center;
  gap: 15px;
  min-height: 90px;
  padding: 12px 20px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 14px;
}

.ranking-position {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: 42px;
  font-weight: 900;
  text-align: center;
}

.ranking-name {
  font-size: 25px;
  font-weight: 900;
}

.ranking-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;
  font-size: 50px;
  font-weight: 900;
  text-align: right;
}

/* =========================================================
   サウンド設定
========================================================= */

.sound-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.sound-item {
  background: #090909;
  border: 1px solid #292929;
  border-radius: 10px;
  padding: 12px;
}

.sound-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 7px;
}

.sound-item input {
  width: 100%;
}

/* =========================================================
   レスポンシブ
========================================================= */

@media (max-width: 800px) {

  .screen {
    padding: 16px;
  }

  .selection-grid,
  .device-grid {
    grid-template-columns: 1fr;
  }

  .input-layout {
    grid-template-columns: 1fr;
  }

  .current-info {
    position: static;
  }

  .staff-player {
    grid-template-columns: 1fr;
  }

  .rule-grid {
    grid-template-columns: 1fr;
  }

  .output-layout {
    grid-template-rows: 40% 60%;
  }

  .other-players {
    grid-template-columns:
      repeat(auto-fit, minmax(160px, 1fr));
  }

  .sound-grid {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 500px) {

  .player-controls {
    grid-template-columns: 1fr;
  }

  .other-player-card {
    min-height: 85px;
  }

  .miss-button {
    width: 100px;
    min-height: 55px;
    font-size: 17px;
  }

  .ranking-row {
    grid-template-columns: 60px 1fr 110px;
    padding: 10px;
  }

  .ranking-position {
    font-size: 30px;
  }

  .ranking-name {
    font-size: 18px;
  }

  .ranking-score {
    font-size: 34px;
  }

}
</style>
</head>

<body>

<!-- =======================================================
     画面1：最初の選択
======================================================= -->

<div id="screen-role" class="screen center-screen">
  <div class="panel">

    <h1 class="title main-title">
      DARTS
    </h1>

    <div class="subtitle">
      SELECT SYSTEM
    </div>

    <div class="selection-grid">

      <button
        class="big-button"
        onclick="selectRole('board1')">
        ダーツボード1
      </button>

      <button
        class="big-button"
        onclick="selectRole('board2')">
        ダーツボード2
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffA')">
        スタッフA
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffB')">
        スタッフB
      </button>

    </div>

  </div>
</div>


<!-- =======================================================
     画面2：入力 / 出力
======================================================= -->

<div id="screen-device" class="screen center-screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="device-board-title">
        ダーツボード1
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>

    <div class="subtitle">
      DEVICE TYPE
    </div>

    <div class="device-grid">

      <button
        class="device-button"
        onclick="openInputDevice()">
        入力デバイス
      </button>

      <button
        class="device-button"
        onclick="openOutputDevice()">
        出力デバイス
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     スタッフ画面
======================================================= -->

<div id="screen-staff" class="screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="staff-title">
        スタッフA
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        プレイヤー管理
      </h3>

      <div class="input-row">

        <input
          id="new-player-name"
          class="text-input"
          type="text"
          placeholder="プレイヤー名">

        <input
          id="new-player-coins"
          class="number-input"
          type="number"
          min="0"
          step="1"
          placeholder="保有コイン">

        <button
          class="action-button primary-button"
          onclick="addStaffPlayer()">
          プレイヤー追加
        </button>

      </div>

    </div>


    <div class="section">

      <h3 class="section-title">
        コイン → 投球数設定
      </h3>

      <div class="rule-grid">

        <div class="rule-item">

          <label>
            1投に必要なコイン
          </label>

          <input
            id="coins-per-throw"
            class="number-input"
            type="number"
            min="1"
            value="10">

        </div>

        <div class="rule-item">

          <label>
            最低投球数
          </label>

          <input
            id="minimum-throws"
            class="number-input"
            type="number"
            min="0"
            value="3">

        </div>

        <div class="rule-item">

          <label>
            最大投球数
          </label>

          <input
            id="maximum-throws"
            class="number-input"
            type="number"
            min="1"
            value="30">

        </div>

      </div>

      <br>

      <button
        class="action-button"
        onclick="saveStaffData()">
        スタッフデータを保存
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        登録プレイヤー
      </h3>

      <div
        id="staff-player-list"
        class="player-editor-list">
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     入力デバイス
======================================================= -->

<div id="screen-input" class="screen hidden">

  <div class="topbar">

    <h2 id="input-title">
      ダーツボード1
    </h2>

    <button
      class="back-button"
      onclick="goDeviceSelect()">
      戻る
    </button>

  </div>


  <div class="input-layout">

<script>

/* =========================================================
   Firebase設定
========================================================= */

const FIREBASE_CONFIG = {

  apiKey: "YOUR_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  databaseURL:
    "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "YOUR_PROJECT",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


let firebaseDb = null;


try {

  if (
    FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" &&
    FIREBASE_CONFIG.databaseURL.indexOf(
      "YOUR_PROJECT"
    ) === -1
  ) {

    firebase.initializeApp(
      FIREBASE_CONFIG
    );

    firebaseDb =
      firebase.database();

  }

} catch (e) {

  console.warn(
    "Firebase initialization failed:",
    e
  );

}


/* =========================================================
   グローバル状態
========================================================= */

let currentRole = null;

let currentBoard = null;

let currentDevice = null;

let currentChannel = "";

let currentStaff = "";

let staffSnapshot = null;

let players = [];

let currentTurnIndex = 0;

let remainingThrows = 0;

let currentRound = 1;

let maxRounds = 1;

let hitMarkers = [];

let gameFinished = false;

let inputLocked = false;


/* =========================================================
   Undo用履歴
========================================================= */

let throwHistory = [];


/* =========================================================
   MP3
========================================================= */

let soundConfig = {

  normal: {
    enabled: false,
    fileName: ""
  },

  double: {
    enabled: false,
    fileName: ""
  },

  triple: {
    enabled: false,
    fileName: ""
  },

  bull: {
    enabled: false,
    fileName: ""
  },

  doubleBull: {
    enabled: false,
    fileName: ""
  },

  miss: {
    enabled: false,
    fileName: ""
  },

  playerChange: {
    enabled: false,
    fileName: ""
  }

};


let audioObjects = {

  normal: null,

  double: null,

  triple: null,

  bull: null,

  doubleBull: null,

  miss: null,

  playerChange: null

};


let audioUrls = {

  normal: null,

  double: null,

  triple: null,

  bull: null,

  doubleBull: null,

  miss: null,

  playerChange: null

};


window._lastSyncTime = 0;


/* =========================================================
   Firebase チャンネル
========================================================= */

function getFirebaseChannelKey() {

  return encodeURIComponent(
    currentChannel
  ).replace(/\./g, '%2E');

}


function initFirebaseChannel(
  chName
) {

  if (!firebaseDb) return;

  currentChannel = chName;

  const channelRef =
    firebaseDb.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    );

  channelRef.off();

  window._lastSyncTime = 0;

  channelRef.on(
    'value',
    snapshot => {

      const data =
        snapshot.val();

      if (
        !data ||
        !data.timestamp
      ) {
        return;
      }

      if (
        window._lastSyncTime &&
        data.timestamp <=
        window._lastSyncTime
      ) {
        return;
      }

      window._lastSyncTime =
        data.timestamp;

      applyIncomingState(
        data
      );

    }
  );

}


/* =========================================================
   Firebaseへ現在のゲーム状態を送信
========================================================= */

function broadcastStateToFirebase(
  triggerBanner = false,
  bannerText = "Player Change"
) {

  if (!firebaseDb) return;

  const statePayload = {

    type: 'STATE_SYNC',

    timestamp:
      Date.now(),

    players:
      players,

    currentTurnIndex:
      currentTurnIndex,

    remainingThrows:
      remainingThrows,

    currentRound:
      currentRound,

    maxRounds:
      maxRounds,

    hitMarkers:
      hitMarkers,

    soundConfig:
      soundConfig,

    gameFinished:
      gameFinished,

    triggerTurnBanner:
      triggerBanner,

    bannerText:
      bannerText

  };


  try {

    firebaseDb
      .ref(
        'darts_channels/' +
        getFirebaseChannelKey()
      )
      .set(
        statePayload
      );

  } catch (e) {

    console.warn(
      "Firebase sync failed:",
      e
    );

  }

}


/* =========================================================
   Firebase受信
========================================================= */

function applyIncomingState(
  data
) {

  if (!data) return;


  if (
    Array.isArray(
      data.players
    )
  ) {

    players =
      data.players;

  }


  currentTurnIndex =
    Number(
      data.currentTurnIndex || 0
    );


  remainingThrows =
    Number(
      data.remainingThrows || 0
    );


  currentRound =
    Number(
      data.currentRound || 1
    );


  maxRounds =
    Number(
      data.maxRounds || 1
    );


  hitMarkers =
    Array.isArray(
      data.hitMarkers
    )
      ? data.hitMarkers
      : [];


  gameFinished =
    data.gameFinished === true;


  if (data.soundConfig) {

    soundConfig =
      data.soundConfig;

  }


  renderInputState();

  renderOutputState();


  if (
    data.triggerTurnBanner
  ) {

    showTurnChangeEffect(
      data.bannerText ||
      "PLAYER CHANGE"
    );

  }


  if (gameFinished) {

    showRanking();

  }

}


/* =========================================================
   画面切り替え
========================================================= */

function hideAllScreens() {

  document
    .querySelectorAll('.screen')
    .forEach(el => {

      el.classList.add(
        'hidden'
      );

    });

}


function selectRole(

) {

  if (

    openStaff('A');

    return;

  }


  if (

  ) {

    return;

  }

    role === 'board1'
  ) {

    currentBoard = 1;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード1';

  }


  if (
    role === 'board2'
  ) {

    currentBoard = 2;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード2';

  }


  hideAllScreens();

  document
    .getElementById(
      'screen-device'
    )
    .classList.remove(
      'hidden'
    );

}

  if (
    firebaseDb &&
    currentChannel
  ) {

    firebaseDb.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    ).off();

  }


  currentRole = null;

  currentBoard = null;

  currentDevice = null;

  currentStaff = "";

  document
    .getElementById(

    .classList.remove(

    .classList.remove(

    );

/* =========================================================
   入力デバイス
========================================================= */

function openInputDevice() {

  currentDevice =
    'input';

  currentChannel =
    'board_' +
    currentBoard;


  hideAllScreens();

  document
    .getElementById(
      'screen-input'
    )
    .classList.remove(
      'hidden'
    );


  document.getElementById(
    'input-title'
  ).textContent =
    'ダーツボード' +
    currentBoard +
    '　入力デバイス';


  initFirebaseChannel(
    currentChannel
  );


  renderInputState();

}


function openOutputDevice() {

  currentDevice =
    'output';

  currentChannel =
    'board_' +
    currentBoard;


  hideAllScreens();

  document
    .getElementById(
      'screen-output'
    )
    .classList.remove(
      'hidden'
    );


  document.getElementById(
    'output-board-name'
  ).textContent =
    'DARTS BOARD ' +
    currentBoard;


  initFirebaseChannel(
    currentChannel
  );


  renderOutputState();

}


/* =========================================================
   スタッフ画面
========================================================= */

function openStaff(
  staff
) {

  currentStaff =
    staff;


  hideAllScreens();

  document
    .getElementById(
      'screen-staff'
    )
    .classList.remove(
      'hidden'
    );


  document.getElementById(
    'staff-title'
  ).textContent =
    'スタッフ' +
    staff;


  loadStaffData();

}


function staffDataRef() {

  if (!firebaseDb) {
    return null;
  }

  return firebaseDb.ref(
    'darts_staff/' +
    currentStaff
  );

}


function loadStaffData() {

  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        currentStaff
      );


    if (local) {

      const data =
        JSON.parse(
          local
        );

      staffSnapshot =
        data;

      renderStaffPlayers(
        data.players ||
        []
      );


      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow ||
        10;


      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows ||
        3;


      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows ||
        30;

    }

    return;

  }


  staffDataRef().once(
    'value',
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        staffSnapshot = {

          players: [],

          coinsPerThrow: 10,

          minimumThrows: 3,

          maximumThrows: 30

        };


        renderStaffPlayers([]);

        return;

      }


      staffSnapshot =
        data;


      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow ||
        10;


      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows ||
        3;


      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows ||
        30;


      renderStaffPlayers(
        data.players ||
        []
      );

    }
  );

}


function addStaffPlayer() {

  const nameInput =
    document.getElementById(
      'new-player-name'
    );

  const coinInput =
    document.getElementById(
      'new-player-coins'
    );


  const name =
    nameInput.value.trim();


  const coins =
    Number(
      coinInput.value
    );


  if (!name) {

    alert(
      'プレイヤー名を入力してください。'
    );

    return;

  }


  if (
    !Number.isFinite(coins) ||
    coins < 0
  ) {

    alert(
      '保有コイン数を正しく入力してください。'
    );

    return;

  }


  const data =
    getCurrentStaffData();


  data.players.push({

    id:
      'p_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name,

    coins:
      Math.floor(
        coins
      )

  });


  saveStaffObject(
    data
  );


  nameInput.value = '';

  coinInput.value = '';


  renderStaffPlayers(
    data.players
  );

}


function removeStaffPlayer(
  id
) {

  const data =
    getCurrentStaffData();


  data.players =
    data.players.filter(
      player =>
        player.id !== id
    );


  saveStaffObject(
    data
  );


  renderStaffPlayers(
    data.players
  );

}


function updateStaffPlayerCoins(
  id,
  value
) {

  const coins =
    Math.max(
      0,
      Math.floor(
        Number(value) ||
        0
      )
    );


  const data =
    getCurrentStaffData();


  const player =
    data.players.find(
      p =>
        p.id === id
    );


  if (!player) {
    return;
  }


  player.coins =
    coins;


  saveStaffObject(
    data
  );

}


function getCurrentStaffData() {

  if (staffSnapshot) {

    return JSON.parse(
      JSON.stringify(
        staffSnapshot
      )
    );

  }


  return {

    players: [],

    coinsPerThrow:
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10,

    minimumThrows:
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 3,

    maximumThrows:
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30

  };

}


function saveStaffObject(
  data
) {

  data.coinsPerThrow =
    Math.max(
      1,
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10
    );


  data.minimumThrows =
    Math.max(
      0,
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 0
    );


  data.maximumThrows =
    Math.max(
      1,
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30
    );


  staffSnapshot =
    data;


  if (firebaseDb) {

    staffDataRef().set(
      data
    );

  } else {

    localStorage.setItem(
      'darts_staff_' +
      currentStaff,
      JSON.stringify(
        data
      )
    );

  }

}


function saveStaffData() {

  const data =
    getCurrentStaffData();


  saveStaffObject(
    data
  );


  alert(
    'スタッフ' +
    currentStaff +
    'のデータを保存しました。'
  );

}


function renderStaffPlayers(
  list
) {

  const container =
    document.getElementById(
      'staff-player-list'

  container.innerHTML = '';


  if (!list.length) {

    container.innerHTML =

            onchange="updateStaffPlayerCoins(

            )">

        </div>

        <button
          class="action-button danger-button"

            '${player.id}'

      `;


      container.appendChild(

      );

    }

}


/* =========================================================
   スタッフのスナップショット読み込み
========================================================= */

function loadStaffSnapshot() {

  const select =
    document.getElementById(
      'input-staff-select'
    );


  const staff =
    select.value;


  if (!staff) {
    return;
  }


  currentStaff =
    staff;


  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        staff
      );


    if (!local) {

      alert(
        'スタッフ' +
        staff +
        'のデータがありません。'
      );

      return;

    }


    applyStaffSnapshot(
      JSON.parse(
        local
      )
    );


    return;

  }


  firebaseDb.ref(
    'darts_staff/' +
    staff
  ).once(
    'value',
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        alert(
          'スタッフ' +
          staff +
          'のデータがありません。'
        );

        return;

      }


      applyStaffSnapshot(
        data
      );

    }
  );

}


function applyStaffSnapshot(
  data
) {

  const ruleCoins =
    Math.max(
      1,
      Number(
        data.coinsPerThrow ||
        10
      )
    );


  const minThrows =
    Math.max(
      0,
      Number(
        data.minimumThrows ||
        0
      )
    );


  const maxThrows =
    Math.max(
      1,
      Number(
        data.maximumThrows ||
        30
      )
    );


  /*
   * スタッフデータを完全コピー。
   * この後スタッフ側でコインを変更しても
   * 現在のゲームには影響しない。
   */

  staffSnapshot =
    JSON.parse(
      JSON.stringify(
        data
      )
    );


  const staffPlayers =
    Array.isArray(
      data.players
    )
      ? data.players
      : [];


  players =
    staffPlayers.map(
      player => {

        const coins =
          Math.max(
            0,
            Number(
              player.coins ||
              0
            )
          );


        const calculatedThrows =
          Math.floor(
            coins /
            ruleCoins
          );


        const throws =
          Math.min(
            maxThrows,
            Math.max(
              minThrows,
              calculatedThrows
            )
          );


        return {

          id:
            player.id ||
            (
              'p_' +
              Date.now() +
              Math.random()
            ),

          name:
            player.name ||
            'Player',

          coinsSnapshot:
            coins,

          score: 0,

          initialThrows:
            throws,

          remainingThrows:
            throws

        };

      }
    );


  currentTurnIndex = 0;

  currentRound = 1;

  maxRounds = 1;

  hitMarkers = [];

  throwHistory = [];

  gameFinished = false;

  inputLocked = false;


  remainingThrows =
    players.length
      ? players[0].remainingThrows
      : 0;


  broadcastStateToFirebase(
    true,
    'START'
  );


  renderInputState();

}


/* =========================================================
   ゲームプレイヤー追加
========================================================= */

function addGamePlayer() {

  if (gameFinished) {
    return;
  }


  const name =
    prompt(
      '追加するプレイヤー名を入力してください'
    );


  if (!name) {
    return;
  }


  const throws =
    prompt(
      'このプレイヤーの投球数を入力してください',
      '3'
    );


  const throwNumber =
    Math.max(
      1,
      Number(
        throws
      ) || 3
    );


  players.push({

    id:
      'game_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name.trim(),

    coinsSnapshot:
      0,

    score:
      0,

    initialThrows:
      throwNumber,

    remainingThrows:
      throwNumber

  });


  if (players.length === 1) {

    currentTurnIndex = 0;

    remainingThrows =
      throwNumber;

  }


  broadcastStateToFirebase();

  renderInputState();

}


/* =========================================================
   プレイヤー削除
========================================================= */

function removeCurrentPlayer() {

  if (
    !players.length ||
    gameFinished
  ) {
    return;
  }


  const player =
    players[
      currentTurnIndex
    ];


  if (!player) {
    return;
  }


  if (
    !confirm(
      player.name +
      'を削除しますか？'
    )
  ) {
    return;
  }


  players.splice(
    currentTurnIndex,
    1
  );


  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex = 0;

  }


  if (players.length) {

    remainingThrows =
      players[
        currentTurnIndex
      ].remainingThrows;

  } else {

    remainingThrows = 0;

  }


  broadcastStateToFirebase(
    true,
    'PLAYER CHANGE'
  );


  renderInputState();

}


/* =========================================================
   点数リセット
========================================================= */

function resetGameScore() {

  if (!players.length) {
    return;
  }


  if (
    !confirm(
      'ゲームの点数をすべてリセットしますか？'
    )
  ) {
    return;
  }


  players.forEach(
    player => {

      player.score = 0;

      player.remainingThrows =
        player.initialThrows;

    }
  );


  currentTurnIndex = 0;

  currentRound = 1;

  hitMarkers = [];

  throwHistory = [];

  gameFinished = false;

  inputLocked = false;


  remainingThrows =
    players.length
      ? players[0].remainingThrows
      : 0;


  hideRanking();


  broadcastStateToFirebase(
    true,
    'RESET'
  );


  renderInputState();

}


/* =========================================================
   ダーツボード生成
========================================================= */

const BOARD_NUMBERS = [

  20,
  1,
  18,
  4,
  13,
  6,
  10,
  15,
  2,
  17,
  3,
  19,
  7,
  16,
  8,
  11,
  14,
  9,
  12,
  5

];


function polarPoint(
  cx,
  cy,
  radius,
  angle
) {

  const rad =
    (
      angle - 90
    ) *
    Math.PI /
    180;


  return {

    x:
      cx +
      radius *
      Math.cos(
        rad
      ),

    y:
      cy +
      radius *
      Math.sin(
        rad
      )

  };

}


function sectorPath(
  cx,
  cy,
  r1,
  r2,
  a1,
  a2
) {

  const p1 =
    polarPoint(
      cx,
      cy,
      r2,
      a1
    );


  const p2 =
    polarPoint(
      cx,
      cy,
      r2,
      a2
    );


  const p3 =
    polarPoint(
      cx,
      cy,
      r1,
      a2
    );


  const p4 =
    polarPoint(
      cx,
      cy,
      r1,
      a1
    );


  return [

    `M ${p1.x} ${p1.y}`,

    `A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}`,

    `L ${p3.x} ${p3.y}`,

    `A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}`,

    'Z'

  ].join(' ');

}


function createSvgElement(
  tag,
  attributes
) {

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      tag
    );


  Object.entries(
    attributes
  ).forEach(
    ([key, value]) => {

      el.setAttribute(
        key,
        value
      );

    }
  );


  return el;

}


/* =========================================================
   ダーツボード
========================================================= */

function buildDartboard() {

  const svg =
    document.getElementById(
      'dartboard'
    );


  const graphics =
    document.getElementById(
      'board-graphics'
    );


  graphics.innerHTML = '';


  const cx = 500;

  const cy = 500;


  /*
   * 元コードの外形を維持。
   */

  const outer = 455;

  const doubleOuter = 420;

  /*
   * 色付き部分を少し広げる。
   * 外観の基本形は変更しない。
   */

  const tripleOuter = 305;

  const tripleInner = 260;

  const bullOuter = 70;

  const bullInner = 31;


  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,

        cy,

        r:
          outer + 18,

        fill:
          '#121212',

        stroke:
          '#2b2b2b',

        'stroke-width':
          10

      }
    )
  );


  const sectorAngle =
    360 / 20;


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const number =
      BOARD_NUMBERS[i];


    const centerAngle =
      i *
      sectorAngle;


    const a1 =
      centerAngle -
      sectorAngle / 2;


    const a2 =
      centerAngle +
      sectorAngle / 2;


    /*
     * ダブル
     */

    const doubleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const doublePath =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              doubleOuter,
              outer,
              a1,
              a2
            ),

          fill:
            doubleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      doublePath
    );


    /*
     * 外側シングル
     */

    const outerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const outerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleOuter,
              doubleOuter,
              a1,
              a2
            ),

          fill:
            outerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      outerSingle
    );


    /*
     * トリプル
     */

    const tripleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const triple =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleInner,
              tripleOuter,
              a1,
              a2
            ),

          fill:
            tripleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      triple
    );


    /*
     * 内側シングル
     */

    const innerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const innerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              bullOuter,
              tripleInner,
              a1,
              a2
            ),

          fill:
            innerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      innerSingle
    );

  }


  /*
   * Outer bull
   */

  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,

        cy,

        r:
          bullOuter,

        fill:
          '#218d42',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    )
  );


  /*
   * Double Bull
   */

  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,

        cy,

        r:
          bullInner,

        fill:
          '#cf2929',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    )
  );


  /*
   * 番号
   */

  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const angle =
      i *
      sectorAngle;


    const p =
      polarPoint(
        cx,
        cy,
        478,
        angle
      );


    const text =
      createSvgElement(
        'text',
        {

          x:
            p.x,

          y:
            p.y,

          fill:
            '#f5f5f5',

          'font-size':
            48,

          'font-weight':
            900,

          'font-family':
            'Arial, sans-serif',

          'text-anchor':
            'middle',

          'dominant-baseline':
            'middle',

          'pointer-events':
            'none'

        }
      );


    text.textContent =
      BOARD_NUMBERS[i];


    graphics.appendChild(
      text
    );

  }


  /*
   * SVG全体でタッチを取得。
   */

  svg.addEventListener(
    'pointerdown',
    handleBoardPointer
  );

}


/* =========================================================
   座標 → 得点判定
========================================================= */

function handleBoardPointer(
  event
) {

  if (
    inputLocked ||
    gameFinished ||
    !players.length ||
    currentTurnIndex < 0
  ) {
    return;
  }


  const player =
    players[
      currentTurnIndex
    ];


  if (
    !player ||
    Number(
      player.remainingThrows
    ) <= 0
  ) {
    return;
  }


  const svg =
    document.getElementById(
      'dartboard'
    );


  const rect =
    svg.getBoundingClientRect();


  /*
   * 画面座標 → SVG座標
   */

  const x =
    (
      event.clientX -
      rect.left
    ) *
    1000 /
    rect.width;


  const y =
    (
      event.clientY -
      rect.top
    ) *
    1000 /
    rect.height;


  const dx =
    x - 500;


  const dy =
    y - 500;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
   * ダーツボード外
   */

  if (
    distance >
    475
  ) {

    return;

  }


  let score = 0;

  let label = 'NORMAL';

  let soundType = 'normal';


  /*
   * Double Bull
   */

  if (
    distance <=
    bullInner
  ) {

    score = 50;

    label =
      'DOUBLE BULL';

    soundType =
      'doubleBull';

  }


  /*
   * Outer Bull
   */

  else if (
    distance <=
    bullOuter
  ) {

    score = 25;

    label =
      'BULL';

    soundType =
      'bull';

  }


  else {

    /*
     * 角度計算。
     *
     * atan2(dx,-dy) により
     * 真上を0度として時計回り。
     */

    let angle =
      Math.atan2(
        dx,
        -dy
      ) *
      180 /
      Math.PI;


    if (
      angle < 0
    ) {
      angle += 360;
    }


    /*
     * 各セクターの中心に最も近い番号を取得。
     */

    let index =
      Math.floor(
        (
          angle +
          sectorAngle / 2
        ) /
        sectorAngle
      );


    index =
      (
        index +
        20
      ) % 20;


    const number =
      BOARD_NUMBERS[index];


    /*
     * Double
     */

    if (
      distance >=
        doubleOuter &&
      distance <=
        475
    ) {

      score =
        number * 2;

      label =
        'DOUBLE';

      soundType =
        'double';

    }


    /*
     * Triple
     */

    else if (
      distance >=
        tripleInner &&
      distance <
        tripleOuter
    ) {

      score =
        number * 3;

      label =
        'TRIPLE';

      soundType =
        'triple';

    }


    /*
     * 通常シングル
     */

    else {

      score =
        number;

      label =
        'NORMAL';

      soundType =
        'normal';

    }

  }


  registerHit(
    score,
    label,
    soundType
  );

}


/* =========================================================
   外れ
========================================================= */

function registerMiss() {

  if (
    inputLocked ||
    gameFinished ||
    !players.length
  ) {
    return;
  }


  const player =
    players[
      currentTurnIndex
    ];


  if (
    !player ||
    Number(
      player.remainingThrows
    ) <= 0
  ) {
    return;
  }


  registerHit(
    0,
    'MISS',
    'miss'
  );

}


/* =========================================================
   Undo用スナップショット
========================================================= */

function saveThrowHistory() {

  throwHistory.push({

    players:
      JSON.parse(
        JSON.stringify(
          players
        )
      ),

    currentTurnIndex:
      currentTurnIndex,

    remainingThrows:
      remainingThrows,

    currentRound:
      currentRound,

    hitMarkers:
      JSON.parse(
        JSON.stringify(
          hitMarkers
        )
      ),

    gameFinished:
      gameFinished,

    inputLocked:
      inputLocked

  });


  /*
   * 履歴を増やしすぎない。
   */

  if (
    throwHistory.length >
    100
  ) {

    throwHistory.shift();

  }

}


/* =========================================================
   一つ前の入力に戻る
========================================================= */

function undoLastThrow() {

  if (
    !throwHistory.length
  ) {

    alert(
      '戻せる入力がありません。'
    );

    return;

  }


  /*
   * PLAYER CHANGE中でも復元可能。
   */

  const previous =
    throwHistory.pop();


  players =
    previous.players;


  currentTurnIndex =
    previous.currentTurnIndex;


  remainingThrows =
    previous.remainingThrows;


  currentRound =
    previous.currentRound;


  hitMarkers =
    previous.hitMarkers;


  gameFinished =
    previous.gameFinished;


  inputLocked = false;


  hideRanking();


  broadcastStateToFirebase(
    false
  );


  renderInputState();

  renderOutputState();

}


/* =========================================================
   得点登録
========================================================= */

function registerHit(
  score,
  label,
  soundType
) {

  if (
    inputLocked ||
    gameFinished ||
    !players.length
  ) {
    return;
  }


  const player =
    players[
      currentTurnIndex
    ];


  if (!player) {
    return;
  }


  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {
    return;
  }


  /*
   * Undo用に変更前を保存。
   */

  saveThrowHistory();


  player.score =
    Number(
      player.score || 0
    ) +
    score;


  player.remainingThrows =
    Math.max(
      0,
      Number(
        player.remainingThrows
      ) - 1
    );


  remainingThrows =
    player.remainingThrows;


  hitMarkers.push({

    score:
      score,

    label:
      label,

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  });


  showHitEffect(
    score,
    label
  );


  playScoreSound(
    soundType
  );


  /*
   * 投球数を使い切った。
   */

  if (
    player.remainingThrows <= 0
  ) {

    /*
     * これ以上入力できないように
     * 一旦ロック。
     */

    inputLocked = true;


    broadcastStateToFirebase(
      true,
      'PLAYER CHANGE'
    );


    renderInputState();

    renderOutputState();


    /*
     * PLAYER CHANGEを表示。
     */

    showTurnChangeEffect(
      'PLAYER CHANGE'
    );


    /*
     * 次のプレイヤーへ移行。
     */

    setTimeout(
      moveToNextPlayer,
      1200
    );


  } else {

    broadcastStateToFirebase();

    renderInputState();

    renderOutputState();

  }

}


/* =========================================================
   次のプレイヤー
========================================================= */

function moveToNextPlayer() {

  if (
    gameFinished ||
    !players.length
  ) {
    return;
  }


  currentTurnIndex++;


  /*
   * 全員終了
   */

  if (
    currentTurnIndex >=
    players.length
  ) {

    /*
     * ここで2週目へ行かず、
     * ゲーム終了。
     */

    currentTurnIndex =
      players.length - 1;

    remainingThrows = 0;

    inputLocked = true;

    gameFinished = true;


    broadcastStateToFirebase(
      true,
      'GAME FINISH'
    );


    renderInputState();

    renderOutputState();


    showRanking();


    return;

  }


  remainingThrows =
    players[
      currentTurnIndex
    ].remainingThrows;


  inputLocked = false;


  broadcastStateToFirebase(
    true,
    'PLAYER CHANGE'
  );


  renderInputState();

  renderOutputState();

}


/*
 * 互換用。
 */

function nextPlayer() {

  moveToNextPlayer();

}


/* =========================================================
   入力画面表示
========================================================= */

function renderInputState() {

  const player =
    players[
      currentTurnIndex
    ];


  document.getElementById(
    'input-current-player'
  ).textContent =
    player
      ? player.name
      : '-';


  document.getElementById(
    'input-current-score'
  ).textContent =
    player
      ? player.score
      : '0';


  document.getElementById(
    'input-throw-count'
  ).textContent =
    player
      ? '残り投球数：' +
        player.remainingThrows
      : '残り投球数：-';


  /*
   * ボード入力のロック状態を視覚的に反映。
   */

  const board =
    document.getElementById(
      'dartboard'
    );


  if (inputLocked) {

    board.style.pointerEvents =
      'none';

  } else {

    board.style.pointerEvents =
      'auto';

  }


  const missButton =
    document.getElementById(
      'miss-button'
    );


  if (missButton) {

    missButton.disabled =
      inputLocked ||
      gameFinished;

  }


  /*
   * 投球者一覧
   */

  const list =
    document.getElementById(
      'input-player-list'
    );


  if (!list) {
    return;
  }


  list.innerHTML = '';


  players.forEach(
    (p, index) => {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'input-player-row' +
        (
          index ===
          currentTurnIndex
            ? ' current'
            : ''
        );


      row.innerHTML = `

        <div class="input-player-number">
          ${index + 1}
        </div>

        <div class="input-player-name">
          ${escapeHtml(p.name)}
        </div>

        <div class="input-player-score">
          ${Number(p.score || 0)}
        </div>

      `;


      list.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   出力画面表示
========================================================= */

function renderOutputState() {

  const current =
    players[
      currentTurnIndex
    ];


  const currentDisplay =
    document.getElementById(
      'current-display'
    );


  if (!current) {

    document.getElementById(
      'output-player-name'
    ).textContent =
      '-';


    document.getElementById(
      'output-score'
    ).textContent =
      '0';


    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：-';

  } else {

    document.getElementById(
      'output-player-name'
    ).textContent =
      current.name;


    document.getElementById(
      'output-score'
    ).textContent =
      current.score;


    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：' +
      current.remainingThrows;

  }


  /*
   * 現在プレイヤーを含めて全員を下段に表示。
   */

  const container =
    document.getElementById(
      'other-players'
    );


  container.innerHTML = '';


  if (!players.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      'プレイヤーがいません' +
      '</div>';

    return;

  }


  players.forEach(
    (player, index) => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'other-player-card' +
        (
          index ===
          currentTurnIndex
            ? ' current'
            : ''
        );


      card.innerHTML = `

        <div class="other-player-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="other-player-score">
          ${Number(player.score || 0)}
        </div>

        <div class="other-player-throws">
          残り投球数：
          ${Number(
            player.remainingThrows || 0
          )}
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  if (currentDisplay) {

    currentDisplay
      .classList
      .remove(
        'player-change'
      );

  }

}


/* =========================================================
   得点演出
========================================================= */

function showHitEffect(
  score,
  label
) {

  const effect =
    document.getElementById(
      'hit-effect'
    );


  const inner =
    document.getElementById(
      'hit-effect-inner'
    );


  inner.textContent =
    score +
    (
      label === 'NORMAL'
        ? ''
        : ' ' +
          label
    );


  effect.classList.remove(
    'active'
  );


  void effect.offsetWidth;


  effect.classList.add(
    'active'
  );

}


/* =========================================================
   PLAYER CHANGE演出
========================================================= */

function showTurnChangeEffect(
  text
) {

  const effect =
    document.getElementById(
      'player-change-effect'
    );


  if (!effect) {
    return;
  }


  effect
    .classList
    .remove(
      'active'
    );


  void effect.offsetWidth;


  effect
    .classList
    .add(
      'active'
    );


  playScoreSound(
    'playerChange'
  );

}


/* =========================================================
   MP3設定
========================================================= */

const SOUND_INPUTS = {

  normal:
    'sound-normal',

  double:
    'sound-double',

  triple:
    'sound-triple',

  bull:
    'sound-bull',

  doubleBull:
    'sound-double-bull',

  miss:
    'sound-miss',

  playerChange:
    'sound-player-change'

};


Object.entries(
  SOUND_INPUTS
).forEach(
  ([type, elementId]) => {

    document
      .getElementById(
        elementId
      )
      .addEventListener(
        'change',
        function() {

          const file =
            this.files &&
            this.files[0];


          if (!file) {
            return;
          }


          if (
            audioUrls[type]
          ) {

            URL.revokeObjectURL(
              audioUrls[type]
            );

          }


          audioUrls[type] =
            URL.createObjectURL(
              file
            );


          audioObjects[type] =
            new Audio(
              audioUrls[type]
            );


          audioObjects[type]
            .preload =
            'auto';


          soundConfig[type] = {

            enabled:
              true,

            fileName:
              file.name

          };


          broadcastStateToFirebase();

        }
      );

  }
);


/* =========================================================
   MP3再生
========================================================= */

function playScoreSound(
  type
) {

  if (!type) {
    type = 'normal';
  }


  const audio =
    audioObjects[type];


  if (
    !audio ||
    !soundConfig[type] ||
    !soundConfig[type].enabled
  ) {
    return;
  }


  try {

    audio.currentTime = 0;

    audio.play()
      .catch(
        () => {}
      );

  } catch (e) {

    console.warn(
      'Audio playback failed:',
      e
    );

  }

}


/* =========================================================
   ランキング
========================================================= */

function showRanking() {

  const screen =
    document.getElementById(
      'ranking-screen'
    );


  const list =
    document.getElementById(
      'ranking-list'
    );


  if (!screen || !list) {
    return;
  }


  /*
   * スコアの高い順。
   */

  const ranking =
    [...players].sort(
      (a, b) =>
        Number(
          b.score || 0
        ) -
        Number(
          a.score || 0
        )
    );


  list.innerHTML = '';


  ranking.forEach(
    (player, index) => {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'ranking-row';


      row.innerHTML = `

        <div class="ranking-position">
          ${index + 1}
        </div>

        <div class="ranking-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="ranking-score">
          ${Number(player.score || 0)}
        </div>

      `;


      list.appendChild(
        row
      );

    }
  );


  screen
    .classList
    .remove(
      'hidden'
    );

}


function hideRanking() {

  const screen =
    document.getElementById(
      'ranking-screen'
    );


  if (screen) {

    screen
      .classList
      .add(
        'hidden'
      );

  }

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  str
) {

  return String(
    str
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   初期化
========================================================= */

buildDartboard();

hideAllScreens();

document
  .getElementById(
    'screen-role'
  )
  .classList
  .remove(
    'hidden'
  );

  );

} else {

  );

}
