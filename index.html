<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SYSTEM</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 28px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.panel {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.main-title {
  font-size: clamp(42px, 8vw, 90px);
  margin: 0 0 14px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 16px;
  margin-bottom: 40px;
}

.selection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  max-width: 850px;
  margin: 0 auto;
}

.big-button {
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 18px;
  background: #141414;
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  transition: 0.15s;
}

.big-button:hover {
  background: #222;
  border-color: #888;
}

.big-button:active {
  transform: scale(0.97);
  background: #333;
}

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topbar h2 {
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(28px, 5vw, 50px);
}

.back-button {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid #555;
  color: #fff;
  background: #151515;
  font-weight: 700;
}

.back-button:active {
  transform: scale(0.97);
}

.section {
  background: #111;
  border: 1px solid #2c2c2c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 16px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.text-input,
.number-input,
.select-input {
  min-height: 52px;
  padding: 10px 14px;
  background: #050505;
  border: 1px solid #444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #aaa;
}

.action-button {
  min-height: 52px;
  padding: 10px 20px;
  background: #1c1c1c;
  border: 1px solid #555;
  color: white;
  border-radius: 10px;
  font-weight: 800;
}

.action-button:active {
  transform: scale(0.97);
  background: #333;
}

.danger-button {
  border-color: #722;
  color: #ffb0b0;
}

.primary-button {
  background: #f5f5f5;
  color: #000;
  border-color: #fff;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-header {
  text-align: center;
  margin-bottom: 30px;
}

.staff-header h1 {
  font-size: clamp(34px, 6vw, 62px);
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.staff-header p {
  color: #999;
}

.player-editor-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.staff-player {
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 220px)
    auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 14px;
  border-radius: 12px;
}

.staff-player-name {
  font-size: 20px;
  font-weight: 800;
}

.coin-label {
  color: #aaa;
  font-size: 13px;
}

.throw-result {
  color: #ddd;
  font-size: 13px;
}

.coin-total {
  font-size: 30px;
  font-weight: 900;
  margin-top: 8px;
}

.rule-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.rule-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

/* =========================================================
   入出力デバイス選択
========================================================= */

.device-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}

.device-button {
  min-height: 190px;
  background: #121212;
  border: 1px solid #444;
  border-radius: 18px;
  color: #fff;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
}

.device-button:active {
  transform: scale(0.97);
  background: #292929;
}

/* =========================================================
   入力画面
========================================================= */

.input-layout {
  display: grid;
  grid-template-columns:
    minmax(320px, 1fr)
    minmax(280px, 420px);
  gap: 25px;
  align-items: start;
}

.board-container {
  width: min(760px, 100%);
  margin: 0 auto;
  position: relative;
  touch-action: none;
}

.board-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  user-select: none;
}

.board-hit {
  cursor: pointer;
}

.board-hit:hover {
  opacity: 0.85;
}

.current-info {
  background: #101010;
  border: 1px solid #303030;
  border-radius: 15px;
  padding: 18px;
  position: sticky;
  top: 10px;
}

.current-player-label {
  color: #aaa;
  font-size: 14px;
}

.current-player {
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 900;
  margin: 3px 0 12px;
}

.current-score {
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  line-height: 0.9;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.throw-count {
  font-size: 20px;
  margin-top: 15px;
  color: #ddd;
}

.staff-select-box {
  margin-bottom: 15px;
}

.staff-select-box label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.staff-select {
  width: 100%;
  min-height: 50px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #050505;
  color: #fff;
}

.player-controls {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.player-controls button {
  min-height: 52px;
}

.sound-control {
  margin-top: 18px;
}

.sound-control label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.sound-control input {
  width: 100%;
}

/* =========================================================
   ヒット演出
========================================================= */

.hit-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.hit-effect.active {
  animation: hitFlash 0.65s ease-out;
}

.hit-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(80px, 18vw, 220px);
  font-weight: 900;
  text-shadow:
    0 0 15px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.4);
}

@keyframes hitFlash {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  20% {
    opacity: 1;
    transform: scale(1.1);
  }
  55% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(1.4);
  }
}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
  padding: 0;
  background: #050505;
  overflow: hidden;
}

.output-layout {
  height: 100vh;
  min-height: 600px;
  display: grid;
  grid-template-rows: 40% 60%;
}

.current-display {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-bottom: 2px solid #292929;
  overflow: hidden;
}

.current-display::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid transparent;
  pointer-events: none;
}

.current-display.player-change::before {
  animation: currentBorder 1.3s ease-out;
}

@keyframes currentBorder {
  0% {
    border-color: #fff;
  }

  100% {
    border-color: transparent;
  }
}

.output-board-name {
  position: absolute;
  top: 12px;
  left: 20px;
  color: #777;
  font-size: 14px;
  letter-spacing: 0.15em;
}

.output-player-name {
  font-size: clamp(30px, 5vw, 70px);
  font-weight: 900;
  margin-bottom: 5px;
}

.output-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;
  font-weight: 900;
  font-size: clamp(100px, 18vw, 250px);
  line-height: 0.9;
  letter-spacing: -0.04em;
}

.output-throws {
  margin-top: 10px;
  font-size: clamp(20px, 3vw, 38px);
  color: #ddd;
  font-weight: 700;
}

.other-players {
  padding: 15px 20px 25px;
  overflow-y: auto;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  align-content: start;
  gap: 12px;
}

.other-player-card {
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 12px;
  padding: 16px 18px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.other-player-name {
  color: #bbb;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.other-player-score {
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    Georgia,
    serif;
  font-size: 45px;
  font-weight: 900;
  line-height: 1;
  margin-top: 5px;
}

.empty-message {
  color: #555;
  text-align: center;
  padding: 30px;
}

/* =========================================================
   レスポンシブ
========================================================= */

@media (max-width: 800px) {
  .screen {
    padding: 16px;
  }

  .selection-grid,
  .device-grid {
    grid-template-columns: 1fr;
  }

  .input-layout {
    grid-template-columns: 1fr;
  }

  .current-info {
    position: static;
  }

  .staff-player {
    grid-template-columns: 1fr;
  }

  .rule-grid {
    grid-template-columns: 1fr;
  }

  .output-layout {
    grid-template-rows: 40% 60%;
  }

  .other-players {
    grid-template-columns:
      repeat(auto-fit, minmax(160px, 1fr));
  }
}

@media (max-width: 500px) {
  .player-controls {
    grid-template-columns: 1fr;
  }

  .other-player-card {
    min-height: 85px;
  }
}
</style>
</head>

<script>
/* =========================================================
   Firebase状態
========================================================= */

let firebaseDb = null;

function getFirebaseDatabase() {

  if (
    window.firebaseReady &&
    window.firebaseDB
  ) {

    firebaseDb =
      window.firebaseDB;

  }

  return firebaseDb;

}


/* =========================================================
   グローバル状態
========================================================= */

let currentRole = null;

let currentBoard = null;

let currentDevice = null;

let currentChannel = "";

let currentStaff = "";

let staffSnapshot = null;

let players = [];

let currentTurnIndex = 0;

let remainingThrows = 0;

let currentRound = 1;

let maxRounds = 1;

let hitMarkers = [];

let soundConfig = {
  enabled: false,
  fileName: ""
};

let localSoundUrl = null;

let localAudio = null;

window._lastSyncTime = 0;


/* =========================================================
   Firebase チャンネル
========================================================= */

function getFirebaseChannelKey() {

  return encodeURIComponent(currentChannel)
    .replace(/\./g, '%2E');

}


function initFirebaseChannel(chName) {

  const db =
    getFirebaseDatabase();

  if (!db) return;

  currentChannel = chName;

  const channelRef =
    db.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    );

  channelRef.off();

  channelRef.on(
    'value',
    (snapshot) => {

      const data =
        snapshot.val();

      if (
        !data ||
        !data.timestamp
      ) {
        return;
      }

      if (
        window._lastSyncTime &&
        data.timestamp <=
        window._lastSyncTime
      ) {
        return;
      }

      window._lastSyncTime =
        data.timestamp;

      applyIncomingState(data);

    }
  );

}


/* =========================================================
   Firebaseへ現在のゲーム状態を送信
========================================================= */

function broadcastStateToFirebase(
  triggerBanner = false,
  bannerText = "Player Change"
) {

  const db =
    getFirebaseDatabase();

  if (!db) return;

  const statePayload = {

    type:
      'STATE_SYNC',

    timestamp:
      Date.now(),

    players:
      players,

    currentTurnIndex:
      currentTurnIndex,

    remainingThrows:
      remainingThrows,

    currentRound:
      currentRound,

    maxRounds:
      maxRounds,

    hitMarkers:
      hitMarkers,

    soundConfig:
      soundConfig,

    triggerTurnBanner:
      triggerBanner,

    bannerText:
      bannerText

  };


  try {

    db
      .ref(
        'darts_channels/' +
        getFirebaseChannelKey()
      )
      .set(
        statePayload
      );

  } catch (e) {

    console.warn(
      "Firebase sync failed:",
      e
    );

  }

}


/* =========================================================
   Firebase受信
========================================================= */

function applyIncomingState(data) {

  if (!data) return;


  if (
    Array.isArray(
      data.players
    )
  ) {

    players =
      data.players;

  }


  currentTurnIndex =
    Number(
      data.currentTurnIndex || 0
    );


  remainingThrows =
    Number(
      data.remainingThrows || 0
    );


  currentRound =
    Number(
      data.currentRound || 1
    );


  maxRounds =
    Number(
      data.maxRounds || 1
    );


  hitMarkers =
    Array.isArray(
      data.hitMarkers
    )
      ? data.hitMarkers
      : [];


  if (
    data.soundConfig
  ) {

    soundConfig =
      data.soundConfig;

  }


  renderInputState();

  renderOutputState();


  if (
    data.triggerTurnBanner
  ) {

    showTurnChangeEffect(
      data.bannerText ||
      "Player Change"
    );

  }

}

function staffDataRef() {

  const db =
    getFirebaseDatabase();

  if (!db) return null;


  return db.ref(
    'darts_staff/' +
    currentStaff
  );

}


/* =========================================================
   スタッフデータ読み込み
========================================================= */

function loadStaffData() {

  const db =
    getFirebaseDatabase();


  if (!db) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        currentStaff
      );


    if (local) {

      const data =
        JSON.parse(local);


      staffSnapshot =
        data;


      renderStaffPlayers(
        data.players ||
        []
      );


      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow ||
        10;


      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows ||
        3;


      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows ||
        30;

    }


    return;

  }


  /*
   * スタッフ画面では onValue を使用。
   *
   * スタッフAをiPad1で変更すると、
   * スタッフAを開いているiPad2にも
   * リアルタイムで反映される。
   */

  const refStaff =
    staffDataRef();


  if (!refStaff) return;


  refStaff.off();


  refStaff.on(
    'value',
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        staffSnapshot = {

          players: [],

          coinsPerThrow: 10,

          minimumThrows: 3,

          maximumThrows: 30

        };


        renderStaffPlayers([]);

        return;

      }


      staffSnapshot =
        JSON.parse(
          JSON.stringify(data)
        );


      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow ||
        10;


      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows ||
        3;


      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows ||
        30;


      renderStaffPlayers(
        data.players ||
        []
      );

    }
  );

}

    getCurrentStaffData();


  data.players =

  );

   スタッフプレイヤーコイン変更

function updateStaffPlayerCoins(
  id,
  value
) {

  const coins =
    Math.max(
      0,
      Math.floor(
        Number(value) || 0
      )
    );


  const data =
    getCurrentStaffData();


  const player =
    data.players.find(
      p =>
        p.id === id
    );


  if (!player) return;


  player.coins =
    coins;


  saveStaffObject(
    data
  );

}

/* =========================================================
   スタッフのスナップショットを入力デバイスで読み込む
========================================================= */

function loadStaffSnapshot() {

  const select =
    document.getElementById(
      'input-staff-select'
    );


  const staff =
    select.value;


  if (!staff) return;


  currentStaff =
    staff;


  const db =
    getFirebaseDatabase();


  if (!db) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        staff
      );


    if (!local) {

      alert(
        'スタッフ' +
        staff +
        'のデータがありません。'
      );

      return;

    }


    applyStaffSnapshot(
      JSON.parse(local)
    );


    return;

  }


  /*
   * once() で読み込む。
   *
   * ここではスタッフデータを
   * ゲーム開始時点のスナップショットとして
   * コピーする。
   *
   * その後スタッフ画面側でコインを変更しても、
   * 現在進行中のゲームデータは変更されない。
   */

  db.ref(
    'darts_staff/' +
    staff
  ).once(
    'value',
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        alert(
          'スタッフ' +
          staff +
          'のデータがありません。'
        );

        return;

      }


      applyStaffSnapshot(
        data
      );

    }
  );

}


/* =========================================================
   スタッフスナップショット適用
========================================================= */

function applyStaffSnapshot(
  data
) {

  const ruleCoins =
    Math.max(
      1,
      Number(
        data.coinsPerThrow ||
        10
      )
    );


  const minThrows =
    Math.max(
      0,
      Number(
        data.minimumThrows ||
        0
      )
    );


  const maxThrows =
    Math.max(
      1,
      Number(
        data.maximumThrows ||
        30
      )
    );


  staffSnapshot =
    JSON.parse(
      JSON.stringify(data)
    );


  const staffPlayers =
    Array.isArray(
      data.players
    )
      ? data.players
      : [];


  players =
    staffPlayers.map(
      player => {

        const coins =
          Math.max(
            0,
            Number(
              player.coins ||
              0
            )
          );


        const calculatedThrows =
          Math.floor(
            coins /
            ruleCoins
          );


        const throws =
          Math.min(
            maxThrows,
            Math.max(
              minThrows,
              calculatedThrows
            )
          );


        return {

          id:
            player.id ||
            (
              'p_' +
              Date.now() +
              Math.random()
            ),

          name:
            player.name ||
            'Player',

          coinsSnapshot:
            coins,

          score:
            0,

          initialThrows:
            throws,

          remainingThrows:
            throws

        };

      }
    );


  currentTurnIndex =
    0;


  currentRound =
    1;


  maxRounds =
    1;


  hitMarkers =
    [];


  if (
    players.length > 0
  ) {

    remainingThrows =
      players[0]
        .remainingThrows;

  } else {

    remainingThrows =
      0;

  }


  broadcastStateToFirebase(
    true,
    'START'
  );


  renderInputState();

}

/* =========================================================
   プレイヤー削除
========================================================= */

function removeCurrentPlayer() {

  if (!players.length) return;


  const player =
    players[
      currentTurnIndex
    ];


  if (!player) return;


  if (
    !confirm(
      player.name +
      'を削除しますか？'
    )
  ) {

    return;

  }


  players.splice(
    currentTurnIndex,
    1
  );


  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex =
      0;

  }


  if (
    players.length
  ) {

    remainingThrows =
      players[
        currentTurnIndex
      ].remainingThrows;

  } else {

    remainingThrows =
      0;

  }


  broadcastStateToFirebase(
    true,
    'Player Change'
  );


  renderInputState();

}

   点数リセット
========================================================= */

function resetGameScore() {

  if (
    !confirm(
      'ゲームの点数をすべてリセットしますか？'
    )
  ) {

    return;

  }


  players.forEach(
    player => {

      player.score =

      player.remainingThrows =

    0;


  currentRound =

  hitMarkers =
    [];


  remainingThrows =
    players.length
      ? players[0]
          .remainingThrows
      : 0;


  broadcastStateToFirebase(
    true,
    'RESET'
  );


  renderInputState();

}


/* =========================================================
   ダーツボード生成
========================================================= */

const BOARD_NUMBERS = [
  20,
  1,
  18,
  4,
  13,
  6,
  10,
  15,
  2,
  17,
  3,
  19,
  7,
  16,
  8,
  11,
  14,
  9,
  12,
  5
];


function polarPoint(
  cx,
  cy,
  radius,
  angle
) {

  const rad =
    (angle - 90) *
    Math.PI /
    180;


  return {

    x:
      cx +
      radius *
      Math.cos(rad),

    y:
      cy +
      radius *
      Math.sin(rad)

  };

}


function sectorPath(
  cx,
  cy,
  r1,
  r2,
  a1,
  a2
) {

  const p1 =
    polarPoint(
      cx,
      cy,
      r2,
      a1
    );


  const p2 =
    polarPoint(
      cx,
      cy,
      r2,
      a2
    );


  const p3 =
    polarPoint(
      cx,
      cy,
      r1,
      a2
    );


  const p4 =
    polarPoint(
      cx,
      cy,
      r1,
      a1
    );


  return [
    `M ${p1.x} ${p1.y}`,
    `A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}`,
    `L ${p3.x} ${p3.y}`,
    `A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}`,
    'Z'
  ].join(' ');

}


function createSvgElement(
  tag,
  attributes
) {

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      tag
    );


  Object.entries(
    attributes
  ).forEach(
    ([key, value]) => {

      el.setAttribute(
        key,
        value
      );

    }
  );


  return el;

}


function buildDartboard() {

  const svg =
    document.getElementById(
      'dartboard'
    );


  const graphics =
    document.getElementById(
      'board-graphics'
    );


  graphics.innerHTML =
    '';


  const cx =
    500;

  const cy =
    500;


  const outer =
    455;

  const doubleOuter =
    420;

  const tripleOuter =
    300;

  const tripleInner =
    265;

  const bullOuter =
    70;

  const bullInner =
    31;


  graphics.appendChild(
    createSvgElement(
      'circle',
      {
        cx,
        cy,
        r:
          outer + 18,
        fill:
          '#121212',
        stroke:
          '#2b2b2b',
        'stroke-width':
          10
      }
    )
  );


  const sectorAngle =
    360 / 20;


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const number =
      BOARD_NUMBERS[i];


    const centerAngle =
      i *
      sectorAngle;


    const a1 =
      centerAngle -
      sectorAngle / 2;


    const a2 =
      centerAngle +
      sectorAngle / 2;


    const doubleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const doublePath =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              doubleOuter,
              outer,
              a1,
              a2
            ),

          fill:
            doubleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      doublePath
    );


    const outerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const outerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleOuter,
              doubleOuter,
              a1,
              a2
            ),

          fill:
            outerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      outerSingle
    );


    const tripleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const triple =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleInner,
              tripleOuter,
              a1,
              a2
            ),

          fill:
            tripleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      triple
    );


    const innerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const innerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              bullOuter,
              tripleInner,
              a1,
              a2
            ),

          fill:
            innerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit'

        }
      );


    graphics.appendChild(
      innerSingle
    );

  }


  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          bullOuter,

        fill:
          '#218d42',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    )
  );


  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          bullInner,

        fill:
          '#cf2929',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    )
  );


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const angle =
      i *
      sectorAngle;


    const p =
      polarPoint(
        cx,
        cy,
        478,
        angle
      );


    const text =
      createSvgElement(
        'text',
        {

          x:
            p.x,

          y:
            p.y,

          fill:
            '#f5f5f5',

          'font-size':
            48,

          'font-weight':
            900,

          'font-family':
            'Arial, sans-serif',

          'text-anchor':
            'middle',

          'dominant-baseline':
            'middle',

          'pointer-events':
            'none'

        }
      );


    text.textContent =
      BOARD_NUMBERS[i];


    graphics.appendChild(
      text
    );

  }


  svg.addEventListener(
    'pointerdown',
    handleBoardPointer
  );

}


/* =========================================================
   ダーツボード座標判定
========================================================= */

function handleBoardPointer(
  event
) {

  if (
    !players.length ||
    currentTurnIndex < 0
  ) {

    return;

  }


  const svg =
    document.getElementById(
      'dartboard'
    );


  const rect =
    svg.getBoundingClientRect();


  const x =
    (
      event.clientX -
      rect.left
    ) *
    1000 /
    rect.width;


  const y =
    (
      event.clientY -
      rect.top
    ) *
    1000 /
    rect.height;


  const dx =
    x - 500;


  const dy =
    y - 500;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (
    distance > 475
  ) {

    return;

  }


  const sectorAngle =
    360 / 20;


  let score =
    0;


  let multiplier =
    1;


  let label =
    'SINGLE';


  if (
    distance <= 31
  ) {

    score =
      50;

    multiplier =
      1;

    label =
      'BULL';

  }

  else if (
    distance <= 70
  ) {

    score =
      25;

    multiplier =
      1;

    label =
      '25';

  }

  else {

    let angle =
      Math.atan2(
        dx,
        -dy
      ) *
      180 /
      Math.PI;


    if (
      angle < 0
    ) {

      angle += 360;

    }


    let index =
      Math.round(
        angle /
        sectorAngle
      );


    index =
      (
        index +
        20
      ) %
      20;


    const number =
      BOARD_NUMBERS[index];


    if (
      distance >= 420 &&
      distance <= 475
    ) {

      multiplier =
        2;

      label =
        'DOUBLE';

    }

    else if (
      distance >= 265 &&
      distance < 300
    ) {

      multiplier =
        3;

      label =
        'TRIPLE';

    }

    else {

      multiplier =
        1;

      label =
        'SINGLE';

    }


    score =
      number *
      multiplier;

  }


  registerHit(
    score,
    label
  );

}


/* =========================================================
   得点登録
========================================================= */

function registerHit(
  score,
  label
) {

  if (
    !players.length
  ) return;


  const player =
    players[
      currentTurnIndex
    ];


  if (!player) return;


  /*
   * 残り投球数が0なら
   * それ以上入力しない。
   */

  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    return;

  }


  player.score =
    Number(
      player.score || 0
    ) +
    score;


  player.remainingThrows--;


  remainingThrows =
    player.remainingThrows;


  hitMarkers.push({

    score:
      score,

    label:
      label,

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  });


  showHitEffect(
    score,
    label
  );


  playScoreSound();


  if (
    player.remainingThrows <= 0
  ) {

    /*
     * 指定投球数を使い切ったら
     * 次のプレイヤーへ。
     */

    nextPlayer();

  } else {

    broadcastStateToFirebase();

    renderInputState();

  }

}


/* =========================================================
   次のプレイヤー
========================================================= */

function nextPlayer() {

  if (
    !players.length
  ) return;


  currentTurnIndex++;


  /*
   * 全員終了した場合は
   * ここでゲーム終了。
   *
   * 2週目には入らない。
   */

  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex =
      players.length - 1;


    remainingThrows =
      0;


    broadcastStateToFirebase(
      true,
      'Player Change'
    );


    renderInputState();

    renderOutputState();

    return;

  }


  remainingThrows =
    players[
      currentTurnIndex
    ].remainingThrows;


  broadcastStateToFirebase(
    true,
    'Player Change'
  );


  renderInputState();

  renderOutputState();

}


/* =========================================================
   入力画面表示
========================================================= */

function renderInputState() {

  const player =
    players[
      currentTurnIndex
    ];


  document.getElementById(
    'input-current-player'
  ).textContent =
    player
      ? player.name
      : '-';


  document.getElementById(
    'input-current-score'
  ).textContent =
    player
      ? player.score
      : '0';


  document.getElementById(
    'input-throw-count'
  ).textContent =
    player
      ? '残り投球数：' +
        player.remainingThrows
      : '残り投球数：-';

}


/* =========================================================
   出力画面表示
========================================================= */

function renderOutputState() {

  const current =
    players[
      currentTurnIndex
    ];


  const currentDisplay =
    document.getElementById(
      'current-display'
    );


  if (!current) {

    document.getElementById(
      'output-player-name'
    ).textContent =
      '-';


    document.getElementById(
      'output-score'
    ).textContent =
      '0';


    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：-';

  } else {

    document.getElementById(
      'output-player-name'
    ).textContent =
      current.name;


    document.getElementById(
      'output-score'
    ).textContent =
      current.score;


    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：' +
      current.remainingThrows;

  }


  const container =
    document.getElementById(
      'other-players'
    );


  container.innerHTML =
    '';


  const others =
    players.filter(
      (_, index) =>
        index !==
        currentTurnIndex
    );


  if (!others.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      '他のプレイヤーはいません' +
      '</div>';

    return;

  }


  others.forEach(
    player => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'other-player-card';


      card.innerHTML = `

        <div class="other-player-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="other-player-score">
          ${Number(player.score || 0)}
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  currentDisplay
    .classList
    .remove(
      'player-change'
    );

}


/* =========================================================
   得点演出
========================================================= */

function showHitEffect(
  score,
  label
) {

  const effect =
    document.getElementById(
      'hit-effect'
    );


  const inner =
    document.getElementById(
      'hit-effect-inner'
    );


  inner.textContent =
    score +
    (
      label === 'SINGLE'
        ? ''
        : ' ' +
          label
    );


  effect.classList.remove(
    'active'
  );


  void effect.offsetWidth;


  effect.classList.add(
    'active'
  );

}


function showTurnChangeEffect(
  text
) {

  const display =
    document.getElementById(
      'current-display'
    );


  if (!display) return;


  display.classList.remove(
    'player-change'
  );


  void display.offsetWidth;


  display.classList.add(
    'player-change'
  );

}


/* =========================================================
   MP3
========================================================= */

document
  .getElementById(
    'sound-file'
  )
  .addEventListener(
    'change',
    function() {

      const file =
        this.files &&
        this.files[0];


      if (!file) return;


      if (
        localSoundUrl
      ) {

        URL.revokeObjectURL(
          localSoundUrl
        );

      }


      localSoundUrl =
        URL.createObjectURL(
          file
        );


      localAudio =
        new Audio(
          localSoundUrl
        );


      localAudio.preload =
        'auto';


      soundConfig = {

        enabled:
          true,

        fileName:
          file.name

      };


      broadcastStateToFirebase();

    }
  );


function playScoreSound() {

  if (
    !localAudio ||
    !soundConfig.enabled
  ) {

    return;

  }


  try {

    localAudio.currentTime =
      0;


    localAudio
      .play()
      .catch(
        () => {}
      );

  } catch (e) {

    console.warn(
      'Audio playback failed:',
      e
    );

  }

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  str
) {

  return String(str)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
