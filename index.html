<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 28px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.panel {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.main-title {
  font-size: clamp(42px, 8vw, 90px);
  margin: 0 0 14px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 16px;
  margin-bottom: 40px;
}

.selection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  max-width: 850px;
  margin: 0 auto;
}

.big-button {
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 18px;
  background: #141414;
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  transition: 0.15s;
}

.big-button:hover {
  background: #222;
  border-color: #888;
}

.big-button:active {
  transform: scale(0.97);
  background: #333;
}

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topbar h2 {
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(28px, 5vw, 50px);
}

.back-button {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid #555;
  color: #fff;
  background: #151515;
  font-weight: 700;
}

.back-button:active {
  transform: scale(0.97);
}

.section {
  background: #111;
  border: 1px solid #2c2c2c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 16px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.text-input,
.number-input,
.select-input {
  min-height: 52px;
  padding: 10px 14px;
  background: #050505;
  border: 1px solid #444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #aaa;
}

.action-button {
  min-height: 52px;
  padding: 10px 20px;
  background: #1c1c1c;
  border: 1px solid #555;
  color: white;
  border-radius: 10px;
  font-weight: 800;
}

.action-button:active {
  transform: scale(0.97);
  background: #333;
}

.danger-button {
  border-color: #722;
  color: #ffb0b0;
}

.primary-button {
  background: #f5f5f5;
  color: #000;
  border-color: #fff;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-header {
  text-align: center;
  margin-bottom: 30px;
}

.staff-header h1 {
  font-size: clamp(34px, 6vw, 62px);
  margin: 0;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.staff-header p {
  color: #999;
}

.player-editor-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.staff-player {
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 220px)
    auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 14px;
  border-radius: 12px;
}

.staff-player-name {
  font-size: 20px;
  font-weight: 800;
}

.coin-label {
  color: #aaa;
  font-size: 13px;
}

.throw-result {
  color: #ddd;
  font-size: 13px;
}

.coin-total {
  font-size: 30px;
  font-weight: 900;
  margin-top: 8px;
}

.rule-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.rule-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

/* =========================================================
   入出力デバイス選択
========================================================= */

.device-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}

.device-button {
  min-height: 190px;
  background: #121212;
  border: 1px solid #444;
  border-radius: 18px;
  color: #fff;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
}

.device-button:active {
  transform: scale(0.97);
  background: #292929;
}

/* =========================================================
   入力画面
========================================================= */

.input-layout {
  display: grid;
  grid-template-columns:
    minmax(320px, 1fr)
    minmax(280px, 420px);
  gap: 25px;
  align-items: start;
}

.board-container {
  width: min(760px, 100%);
  margin: 0 auto;
  position: relative;
  touch-action: none;
}

.board-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  user-select: none;
}

.board-hit {
  cursor: pointer;
}

.board-hit:hover {
  opacity: 0.85;
}

.miss-button {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 20;

  min-width: 130px;
  min-height: 65px;

  border-radius: 12px;
  border: 1px solid #777;

  background: #151515;
  color: #fff;

  font-size: 22px;
  font-weight: 900;
}

.miss-button:active {
  transform: scale(0.96);
  background: #333;
}

.current-info {
  background: #101010;
  border: 1px solid #303030;
  border-radius: 15px;
  padding: 18px;
  position: sticky;
  top: 10px;
}

.current-player-label {
  color: #aaa;
  font-size: 14px;
}

.current-player {
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 900;
  margin: 3px 0 12px;
}

.current-score {
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  line-height: 0.9;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.throw-count {
  font-size: 20px;
  margin-top: 15px;
  color: #ddd;
}

.staff-select-box {
  margin-bottom: 15px;
}

.staff-select-box label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.staff-select {
  width: 100%;
  min-height: 50px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #050505;
  color: #fff;
}

.player-controls {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.player-controls button {
  min-height: 52px;
}

.undo-button {
  margin-top: 8px;
  width: 100%;
}

.input-player-list {
  margin-top: 18px;
  border-top: 1px solid #292929;
  padding-top: 15px;
}

.input-player-list-title {
  color: #aaa;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 8px;
}

.input-player-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding: 10px 12px;
  margin-bottom: 6px;

  background: #090909;
  border: 1px solid #292929;
  border-radius: 8px;
}

.input-player-item.current {
  border-color: #777;
  background: #181818;
}

.input-player-item-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 800;
}

.input-player-item-score {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: 24px;
  font-weight: 900;
}

.input-player-item-throws {
  color: #aaa;
  font-size: 12px;
}

.sound-control {
  margin-top: 18px;
}

.sound-control-title {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.sound-item {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 7px;
}

.sound-item-label {
  font-size: 13px;
  color: #ddd;
}

/* =========================================================
   ヒット演出
========================================================= */

.hit-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.hit-effect.active {
  animation: hitFlash 0.65s ease-out;
}

.hit-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(80px, 18vw, 220px);
  font-weight: 900;
  text-shadow:
    0 0 15px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.4);
}

@keyframes hitFlash {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  20% {
    opacity: 1;
    transform: scale(1.1);
  }

  55% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.4);
  }
}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
  padding: 0;
  background: #050505;
  overflow: hidden;
}

.output-layout {
  height: 100vh;
  min-height: 600px;
  display: grid;
  grid-template-rows: 40% 60%;
}

.current-display {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-bottom: 2px solid #292929;
  overflow: hidden;
}

.current-display::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid transparent;
  pointer-events: none;
}

.current-display.player-change::before {
  animation: currentBorder 1.3s ease-out;
}

.current-display.current-glow {
  border-color: #4d4300;
  box-shadow:
    inset 0 0 35px rgba(255, 220, 0, 0.10),
    0 0 25px rgba(255, 220, 0, 0.08);
}

.current-display.current-glow::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 2px solid rgba(255, 220, 0, 0.65);
  box-shadow:
    0 0 18px rgba(255, 220, 0, 0.55);
  pointer-events: none;
  animation: yellowGlow 1.5s ease-in-out infinite;
}

@keyframes yellowGlow {
  0%,
  100% {
    opacity: 0.45;
  }

  50% {
    opacity: 1;
  }
}

@keyframes currentBorder {
  0% {
    border-color: #fff;
  }

  100% {
    border-color: transparent;
  }
}

.output-board-name {
  position: absolute;
  top: 12px;
  left: 20px;
  color: #777;
  font-size: 14px;
  letter-spacing: 0.15em;
}

.output-player-name {
  font-size: clamp(30px, 5vw, 70px);
  font-weight: 900;
  margin-bottom: 5px;
}

.output-score {
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
  font-weight: 900;
  font-size: clamp(100px, 18vw, 250px);
  line-height: 0.9;
  letter-spacing: -0.04em;
}

.output-throws {
  margin-top: 10px;
  font-size: clamp(20px, 3vw, 38px);
  color: #ddd;
  font-weight: 700;
}

.other-players {
  padding: 15px 20px 25px;
  overflow-y: auto;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  align-content: start;
  gap: 12px;
}

.other-player-card {
  background: #111;
  border: 1px solid #2b2b2b;
  border-radius: 12px;
  padding: 16px 18px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.other-player-card.current {
  border-color: #d9b900;
  box-shadow:
    0 0 15px rgba(255, 220, 0, 0.20);
}

.other-player-name {
  color: #bbb;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.other-player-score {
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
  font-size: 45px;
  font-weight: 900;
  line-height: 1;
  margin-top: 5px;
}

.empty-message {
  color: #555;
  text-align: center;
  padding: 30px;
}

/* =========================================================
   ランキング
========================================================= */

.ranking-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;

  background: rgba(0,0,0,.96);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;
}

.ranking-panel {
  width: min(1000px, 100%);
  max-height: 92vh;
  overflow-y: auto;

  background: #101010;
  border: 1px solid #444;
  border-radius: 18px;

  padding: 25px;
}

.ranking-title {
  text-align: center;
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: clamp(35px, 6vw, 70px);
  font-weight: 900;
  margin: 0 0 8px;
}

.ranking-subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 25px;
}

.ranking-row {
  display: grid;
  grid-template-columns:
    80px
    1fr
    180px;

  align-items: center;
  gap: 15px;

  padding: 16px;

  background: #080808;
  border: 1px solid #292929;
  border-radius: 10px;

  margin-bottom: 8px;
}

.ranking-rank {
  font-family:
    Georgia,
    "Times New Roman",
    serif;
  font-size: 35px;
  font-weight: 900;
  text-align: center;
}

.ranking-name {
  font-size: 24px;
  font-weight: 900;
}

.ranking-score {
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Arial,
    sans-serif;
  font-size: 40px;
  font-weight: 900;
  text-align: right;
}

.ranking-close {
  display: block;
  width: 100%;
  min-height: 58px;
  margin-top: 18px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #f5f5f5;
  color: #000;
  font-weight: 900;
}

/* =========================================================
   レスポンシブ
========================================================= */

@media (max-width: 800px) {

  .screen {
    padding: 16px;
  }

  .selection-grid,
  .device-grid {
    grid-template-columns: 1fr;
  }

  .input-layout {
    grid-template-columns: 1fr;
  }

  .current-info {
    position: static;
  }

  .staff-player {
    grid-template-columns: 1fr;
  }

  .rule-grid {
    grid-template-columns: 1fr;
  }

  .output-layout {
    grid-template-rows: 40% 60%;
  }

  .other-players {
    grid-template-columns:
      repeat(auto-fit, minmax(160px, 1fr));
  }

}

@media (max-width: 500px) {

  .player-controls {
    grid-template-columns: 1fr;
  }

  .other-player-card {
    min-height: 85px;
  }

  .ranking-row {
    grid-template-columns:
      55px
      1fr
      100px;
  }

  .ranking-name {
    font-size: 18px;
  }

  .ranking-score {
    font-size: 28px;
  }

  .miss-button {
    min-width: 105px;
    min-height: 55px;
    font-size: 18px;
  }

  .sound-item {
    grid-template-columns: 90px 1fr;
  }

}
</style>
</head>

<body>

<!-- =======================================================
     画面1：最初の選択
======================================================= -->

<div id="screen-role" class="screen center-screen">

  <div class="panel">

    <h1 class="title main-title">
      DARTS
    </h1>

    <div class="subtitle">
      SELECT SYSTEM
    </div>

    <div class="selection-grid">

      <button
        class="big-button"
        onclick="selectRole('board1')">
        ダーツボード1
      </button>

      <button
        class="big-button"
        onclick="selectRole('board2')">
        ダーツボード2
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffA')">
        スタッフA
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffB')">
        スタッフB
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     画面2：入力 / 出力
======================================================= -->

<div id="screen-device" class="screen center-screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="device-board-title">
        ダーツボード1
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>

    <div class="subtitle">
      DEVICE TYPE
    </div>

    <div class="device-grid">

      <button
        class="device-button"
        onclick="openInputDevice()">
        入力デバイス
      </button>

      <button
        class="device-button"
        onclick="openOutputDevice()">
        出力デバイス
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     スタッフ画面
======================================================= -->

<div id="screen-staff" class="screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="staff-title">
        スタッフA
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        プレイヤー管理
      </h3>

      <div class="input-row">

        <input
          id="new-player-name"
          class="text-input"
          type="text"
          placeholder="プレイヤー名">

        <input
          id="new-player-coins"
          class="number-input"
          type="number"
          min="0"
          step="1"
          placeholder="保有コイン">

        <button
          class="action-button primary-button"
          onclick="addStaffPlayer()">
          プレイヤー追加
        </button>

      </div>

    </div>


    <div class="section">

      <h3 class="section-title">
        コイン → 投球数設定
      </h3>

      <div class="rule-grid">

        <div class="rule-item">

          <label>
            1投に必要なコイン
          </label>

          <input
            id="coins-per-throw"
            class="number-input"
            type="number"
            min="1"
            value="10">

        </div>

        <div class="rule-item">

          <label>
            最低投球数
          </label>

          <input
            id="minimum-throws"
            class="number-input"
            type="number"
            min="0"
            value="3">

        </div>

        <div class="rule-item">

          <label>
            最大投球数
          </label>

          <input
            id="maximum-throws"
            class="number-input"
            type="number"
            min="1"
            value="30">

        </div>

      </div>

      <br>

      <button
        class="action-button"
        onclick="saveStaffData()">
        スタッフデータを保存
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        登録プレイヤー
      </h3>

      <div
        id="staff-player-list"
        class="player-editor-list">
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     入力デバイス
======================================================= -->

<div id="screen-input" class="screen hidden">

  <div class="topbar">

    <h2 id="input-title">
      ダーツボード1
    </h2>

    <button
      class="back-button"
      onclick="goDeviceSelect()">
      戻る
    </button>

  </div>


  <div class="input-layout">

    <div>

      <div class="board-container">

        <svg
          id="dartboard"
          class="board-svg"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg">

          <g id="board-graphics"></g>

        </svg>


        <!-- 左下の外れボタン -->

        <button
          class="miss-button"
          onclick="registerMiss()">
          外れ
        </button>

      </div>

    </div>


    <div>

      <div class="current-info">

        <div class="staff-select-box">

          <label>
            使用するスタッフ
          </label>

          <select
            id="input-staff-select"
            class="staff-select"
            onchange="loadStaffSnapshot()">

            <option value="">
              スタッフを選択
            </option>

            <option value="A">
              スタッフA
            </option>

            <option value="B">
              スタッフB
            </option>

          </select>

        </div>


        <div class="current-player-label">

<script>
/* =========================================================
   Firebase設定
========================================================= */

const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let firebaseDb = null;

try {

  if (
    FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" &&
    FIREBASE_CONFIG.databaseURL.indexOf("YOUR_PROJECT") === -1
  ) {

    firebase.initializeApp(FIREBASE_CONFIG);

    firebaseDb = firebase.database();

  }

} catch (e) {

  console.warn(
    "Firebase initialization failed:",
    e
  );

}


/* =========================================================
   グローバル状態
========================================================= */

let currentRole = null;

let currentBoard = null;

let currentDevice = null;

let currentChannel = "";

let currentStaff = "";

let staffSnapshot = null;

let players = [];

let currentTurnIndex = 0;

let remainingThrows = 0;

let currentRound = 1;

let maxRounds = 1;

let gameFinished = false;

let hitMarkers = [];

let actionHistory = [];

let soundConfig = {
  normal: "",
  double: "",
  triple: "",
  bull: "",
  doubleBull: "",
  miss: "",
  playerChange: ""
};

let localSounds = {
  normal: null,
  double: null,
  triple: null,
  bull: null,
  doubleBull: null,
  miss: null,
  playerChange: null
};

let soundObjectUrls = [];

window._lastSyncTime = 0;


/* =========================================================
   Firebase チャンネル
========================================================= */

function getFirebaseChannelKey() {

  return encodeURIComponent(currentChannel)
    .replace(/\./g, '%2E');

}


function initFirebaseChannel(chName) {

  if (!firebaseDb) return;

  currentChannel = chName;

  const channelRef = firebaseDb.ref(
    'darts_channels/' +
    getFirebaseChannelKey()
  );

  channelRef.off();

  channelRef.on('value', (snapshot) => {

    const data = snapshot.val();

    if (!data || !data.timestamp) return;

    if (
      window._lastSyncTime &&
      data.timestamp <= window._lastSyncTime
    ) {

      return;

    }

    window._lastSyncTime =
      data.timestamp;

    applyIncomingState(data);

  });

}


/* =========================================================
   Firebaseへ現在のゲーム状態を送信
========================================================= */

function broadcastStateToFirebase(
  triggerBanner = false,
  bannerText = "Player Change"
) {

  if (!firebaseDb) return;

  const statePayload = {

    type: 'STATE_SYNC',

    timestamp: Date.now(),

    players: players,

    currentTurnIndex:
      currentTurnIndex,

    remainingThrows:
      remainingThrows,

    currentRound:
      currentRound,

    maxRounds:
      maxRounds,

    gameFinished:
      gameFinished,

    hitMarkers:
      hitMarkers,

    actionHistory:
      actionHistory,

    soundConfig:
      soundConfig,

    triggerTurnBanner:
      triggerBanner,

    bannerText:
      bannerText

  };

  try {

    firebaseDb
      .ref(
        'darts_channels/' +
        getFirebaseChannelKey()
      )
      .set(statePayload);

  } catch (e) {

    console.warn(
      "Firebase sync failed:",
      e
    );

  }

}


/* =========================================================
   Firebase受信
========================================================= */

function applyIncomingState(data) {

  if (!data) return;

  if (Array.isArray(data.players)) {

    players =
      data.players;

  }

  currentTurnIndex =
    Number(
      data.currentTurnIndex || 0
    );

  remainingThrows =
    Number(
      data.remainingThrows || 0
    );

  currentRound =
    Number(
      data.currentRound || 1
    );

  maxRounds =
    Number(
      data.maxRounds || 1
    );

  gameFinished =
    Boolean(
      data.gameFinished
    );

  hitMarkers =
    Array.isArray(
      data.hitMarkers
    )
      ? data.hitMarkers
      : [];

  actionHistory =
    Array.isArray(
      data.actionHistory
    )
      ? data.actionHistory
      : [];

  if (data.soundConfig) {

    soundConfig =
      data.soundConfig;

  }

  renderInputState();

  renderOutputState();

  if (data.triggerTurnBanner) {

    showTurnChangeEffect(
      data.bannerText ||
      "Player Change"
    );

  }

  if (
    gameFinished &&
    currentDevice === 'output'
  ) {

    showRanking();

  }

}


/* =========================================================
   画面切り替え
========================================================= */

function hideAllScreens() {

  document
    .querySelectorAll('.screen')
    .forEach(el => {

      el.classList.add(
        'hidden'
      );

    });

}


function selectRole(role) {

  currentRole = role;

  if (role === 'staffA') {

    openStaff('A');

    return;

  }

  if (role === 'staffB') {

    openStaff('B');

    return;

  }

  if (role === 'board1') {

    currentBoard = 1;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード1';

  }

  if (role === 'board2') {

    currentBoard = 2;

    document.getElementById(
      'device-board-title'
    ).textContent =
      'ダーツボード2';

  }

  hideAllScreens();

  document
    .getElementById(
      'screen-device'
    )
    .classList.remove(
      'hidden'
    );

}


function goRoleSelect() {

  if (
    firebaseDb &&
    currentChannel
  ) {

    firebaseDb.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    ).off();

  }

  currentRole = null;

  currentBoard = null;

  currentDevice = null;

  currentStaff = "";

  currentChannel = "";

  hideAllScreens();

  document
    .getElementById(
      'screen-role'
    )
    .classList.remove(
      'hidden'
    );

}


function goDeviceSelect() {

  hideAllScreens();

  document
    .getElementById(
      'screen-device'
    )
    .classList.remove(
      'hidden'
    );

}


/* =========================================================
   入力デバイス
========================================================= */

function openInputDevice() {

  currentDevice = 'input';

  currentChannel =
    'board_' +
    currentBoard;

  hideAllScreens();

  document
    .getElementById(
      'screen-input'
    )
    .classList.remove(
      'hidden'
    );

  document.getElementById(
    'input-title'
  ).textContent =
    'ダーツボード' +
    currentBoard +
    '　入力デバイス';

  initFirebaseChannel(
    currentChannel
  );

  renderInputState();

}


function openOutputDevice() {

  currentDevice = 'output';

  currentChannel =
    'board_' +
    currentBoard;

  hideAllScreens();

  document
    .getElementById(
      'screen-output'
    )
    .classList.remove(
      'hidden'
    );

  document.getElementById(
    'output-board-name'
  ).textContent =
    'DARTS BOARD ' +
    currentBoard;

  initFirebaseChannel(
    currentChannel
  );

  renderOutputState();

}


/* =========================================================
   スタッフ画面
========================================================= */

function openStaff(staff) {

  currentStaff = staff;

  hideAllScreens();

  document
    .getElementById(
      'screen-staff'
    )
    .classList.remove(
      'hidden'
    );

  document.getElementById(
    'staff-title'
  ).textContent =
    'スタッフ' +
    staff;

  loadStaffData();

}


function staffDataRef() {

  if (!firebaseDb) return null;

  return firebaseDb.ref(
    'darts_staff/' +
    currentStaff
  );

}


function loadStaffData() {

  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        currentStaff
      );

    if (local) {

      const data =
        JSON.parse(local);

      staffSnapshot =
        data;

      renderStaffPlayers(
        data.players || []
      );

      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow || 10;

      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows || 3;

      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows || 30;

    }

    return;

  }


  staffDataRef().once(
    'value',
    snapshot => {

      const data =
        snapshot.val();

      if (!data) {

        staffSnapshot = {
          players: [],
          coinsPerThrow: 10,
          minimumThrows: 3,
          maximumThrows: 30
        };

        renderStaffPlayers([]);

        return;

      }

      staffSnapshot =
        data;

      document.getElementById(
        'coins-per-throw'
      ).value =
        data.coinsPerThrow || 10;

      document.getElementById(
        'minimum-throws'
      ).value =
        data.minimumThrows || 3;

      document.getElementById(
        'maximum-throws'
      ).value =
        data.maximumThrows || 30;

      renderStaffPlayers(
        data.players || []
      );

    }
  );

}


function addStaffPlayer() {

  const nameInput =
    document.getElementById(
      'new-player-name'
    );

  const coinInput =
    document.getElementById(
      'new-player-coins'
    );

  const name =
    nameInput.value.trim();

  const coins =
    Number(
      coinInput.value
    );

  if (!name) {

    alert(
      'プレイヤー名を入力してください。'
    );

    return;

  }

  if (
    !Number.isFinite(coins) ||
    coins < 0
  ) {

    alert(
      '保有コイン数を正しく入力してください。'
    );

    return;

  }

  const data =
    getCurrentStaffData();

  data.players.push({

    id:
      'p_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name,

    coins:
      Math.floor(coins)

  });

  saveStaffObject(data);

  nameInput.value = '';

  coinInput.value = '';

  renderStaffPlayers(
    data.players
  );

}


function removeStaffPlayer(id) {

  const data =
    getCurrentStaffData();

  data.players =
    data.players.filter(
      player =>
        player.id !== id
    );

  saveStaffObject(data);

  renderStaffPlayers(
    data.players
  );

}


function updateStaffPlayerCoins(
  id,
  value
) {

  const coins =
    Math.max(
      0,
      Math.floor(
        Number(value) || 0
      )
    );

  const data =
    getCurrentStaffData();

  const player =
    data.players.find(
      p =>
        p.id === id
    );

  if (!player) return;

  player.coins =
    coins;

  saveStaffObject(data);

}


function getCurrentStaffData() {

  if (staffSnapshot) {

    return JSON.parse(
      JSON.stringify(
        staffSnapshot
      )
    );

  }

  return {

    players: [],

    coinsPerThrow:
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10,

    minimumThrows:
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 3,

    maximumThrows:
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30

  };

}


function saveStaffObject(data) {

  data.coinsPerThrow =
    Math.max(
      1,
      Number(
        document.getElementById(
          'coins-per-throw'
        ).value
      ) || 10
    );

  data.minimumThrows =
    Math.max(
      0,
      Number(
        document.getElementById(
          'minimum-throws'
        ).value
      ) || 0
    );

  data.maximumThrows =
    Math.max(
      1,
      Number(
        document.getElementById(
          'maximum-throws'
        ).value
      ) || 30
    );

  staffSnapshot =
    data;

  if (firebaseDb) {

    staffDataRef().set(
      data
    );

  } else {

    localStorage.setItem(
      'darts_staff_' +
      currentStaff,
      JSON.stringify(data)
    );

  }

}


function saveStaffData() {

  const data =
    getCurrentStaffData();

  saveStaffObject(data);

  alert(
    'スタッフ' +
    currentStaff +
    'のデータを保存しました。'
  );

}


function renderStaffPlayers(
  list
) {

  const container =
    document.getElementById(
      'staff-player-list'
    );

  container.innerHTML = '';

  if (!list.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      'プレイヤーが登録されていません' +
      '</div>';

    return;

  }


  list.forEach(player => {

    const row =
      document.createElement(
        'div'
      );

    row.className =
      'staff-player';

    row.innerHTML = `

      <div>

        <div class="staff-player-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="coin-label">
          保有コイン
        </div>

      </div>

      <div>

        <input
          class="number-input"
          style="width:100%;"
          type="number"
          min="0"
          value="${Number(player.coins || 0)}"
          onchange="updateStaffPlayerCoins(
            '${player.id}',
            this.value
          )">

      </div>

      <button
        class="action-button danger-button"
        onclick="removeStaffPlayer(
          '${player.id}'
        )">
        削除
      </button>

    `;

    container.appendChild(

    );

  });

}


/* =========================================================
   スタッフスナップショット読み込み
========================================================= */

function loadStaffSnapshot() {

  const select =
    document.getElementById(
      'input-staff-select'
    );

  const staff =
    select.value;

  if (!staff) return;

  currentStaff =
    staff;

  if (!firebaseDb) {

    const local =
      localStorage.getItem(
        'darts_staff_' +
        staff
      );

    if (!local) {

      alert(
        'スタッフ' +
        staff +
        'のデータがありません。'
      );

      return;

    }

    applyStaffSnapshot(
      JSON.parse(local)
    );

    return;

  }


  firebaseDb.ref(
    'darts_staff/' +
    staff
  ).once(
    'value',
    snapshot => {

      const data =
        snapshot.val();

      if (!data) {

        alert(
          'スタッフ' +
          staff +
          'のデータがありません。'
        );

        return;

      }

      /*
       * once()で取得した瞬間のデータだけを
       * ゲーム側へコピーする。
       */

      applyStaffSnapshot(
        data
      );

    }
  );

}


function applyStaffSnapshot(data) {

  const ruleCoins =
    Math.max(
      1,
      Number(
        data.coinsPerThrow ||
        10
      )
    );

  const minThrows =
    Math.max(
      0,
      Number(
        data.minimumThrows ||
        0
      )
    );

  const maxThrows =
    Math.max(
      1,
      Number(
        data.maximumThrows ||
        30
      )
    );


  /*
   * スタッフデータを完全コピー。
   *
   * この後スタッフ側のコインを変更しても
   * 現在のゲームには影響しない。
   */

  staffSnapshot =
    JSON.parse(
      JSON.stringify(data)
    );


  const staffPlayers =
    Array.isArray(
      data.players
    )
      ? data.players
      : [];


  players =
    staffPlayers.map(
      player => {

        const coins =
          Math.max(
            0,
            Number(
              player.coins ||
              0
            )
          );

        const calculatedThrows =
          Math.floor(
            coins /
            ruleCoins
          );

        const throws =
          Math.min(
            maxThrows,
            Math.max(
              minThrows,
              calculatedThrows
            )
          );

        return {

          id:
            player.id ||
            (
              'p_' +
              Date.now() +
              Math.random()
            ),

          name:
            player.name ||
            'Player',

          coinsSnapshot:
            coins,

          score: 0,

          initialThrows:
            throws,

          remainingThrows:
            throws

        };

      }
    );


  currentTurnIndex =
    0;

  currentRound =
    1;

  maxRounds =
    1;

  gameFinished =
    false;

  hitMarkers =
    [];

  actionHistory =
    [];


  remainingThrows =
    players.length
      ? players[0].remainingThrows
      : 0;


  /*
   * ゲーム開始状態を保存。
   */

  broadcastStateToFirebase(
    true,
    'START'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   ゲームプレイヤー追加
========================================================= */

function addGamePlayer() {

  if (gameFinished) return;

  const name =
    prompt(
      '追加するプレイヤー名を入力してください'
    );

  if (!name) return;

  const throws =
    prompt(
      'このプレイヤーの投球数を入力してください',
      '3'
    );

  const throwNumber =
    Math.max(
      1,
      Number(
        throws
      ) || 3
    );


  players.push({

    id:
      'game_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name.trim(),

    coinsSnapshot:
      0,

    score:
      0,

    initialThrows:
      throwNumber,

    remainingThrows:
      throwNumber

  });


  if (players.length === 1) {

    currentTurnIndex =
      0;

    remainingThrows =
      throwNumber;

  }


  broadcastStateToFirebase();

  renderInputState();

  renderOutputState();

}


/* =========================================================
   プレイヤー削除
========================================================= */

function removeCurrentPlayer() {

  if (
    gameFinished ||
    !players.length
  ) {
    return;
  }

  const player =
    players[currentTurnIndex];

  if (!player) return;

  if (
    !confirm(
      player.name +
      'を削除しますか？'
    )
  ) {

    return;

  }


  players.splice(
    currentTurnIndex,
    1
  );


  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex =
      0;

  }


  if (players.length) {

    remainingThrows =
      players[
        currentTurnIndex
      ].remainingThrows;

  } else {

    remainingThrows =
      0;

  }


  broadcastStateToFirebase(
    true,
    'Player Change'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   点数リセット
========================================================= */

function resetGameScore() {

  if (!players.length) return;

  if (
    !confirm(
      'ゲームの点数をすべてリセットしますか？'
    )
  ) {

    return;

  }


  players.forEach(
    player => {

      player.score =
        0;

      player.remainingThrows =
        player.initialThrows;

    }
  );


  currentTurnIndex =
    0;

  currentRound =
    1;

  gameFinished =
    false;

  hitMarkers =
    [];

  actionHistory =
    [];

  remainingThrows =
    players.length
      ? players[0].remainingThrows
      : 0;


  closeRanking();


  broadcastStateToFirebase(
    true,
    'RESET'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   ダーツボード
========================================================= */

const BOARD_NUMBERS = [
  20,
  1,
  18,
  4,
  13,
  6,
  10,
  15,
  2,
  17,
  3,
  19,
  7,
  16,
  8,
  11,
  14,
  9,
  12,
  5
];


const sectorAngle =
  360 / 20;


function polarPoint(
  cx,
  cy,
  radius,
  angle
) {

  const rad =
    (angle - 90) *
    Math.PI /
    180;

  return {

    x:
      cx +
      radius *
      Math.cos(rad),

    y:
      cy +
      radius *
      Math.sin(rad)

  };

}


function sectorPath(
  cx,
  cy,
  r1,
  r2,
  a1,
  a2
) {

  const p1 =
    polarPoint(
      cx,
      cy,
      r2,
      a1
    );

  const p2 =
    polarPoint(
      cx,
      cy,
      r2,
      a2
    );

  const p3 =
    polarPoint(
      cx,
      cy,
      r1,
      a2
    );

  const p4 =
    polarPoint(
      cx,
      cy,
      r1,
      a1
    );


  return [

    `M ${p1.x} ${p1.y}`,

    `A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}`,

    `L ${p3.x} ${p3.y}`,

    `A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}`,

    'Z'

  ].join(' ');

}


function createSvgElement(
  tag,
  attributes
) {

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      tag
    );

  Object.entries(
    attributes
  ).forEach(
    ([key, value]) => {

      el.setAttribute(
        key,
        value
      );

    }
  );

  return el;

}


/* =========================================================
   ダーツボード生成
========================================================= */

function buildDartboard() {

  const svg =
    document.getElementById(
      'dartboard'
    );

  const graphics =
    document.getElementById(
      'board-graphics'
    );

  graphics.innerHTML = '';


  const cx = 500;
  const cy = 500;


  /*
   * 元の外形は維持。
   */

  const outer =
    455;

  const doubleOuter =
    420;


  /*
   * 色付きリングだけ少し広げる。
   *
   * 元：
   * Triple 265〜300
   * Double 420〜455
   *
   * 変更：
   * Triple 258〜307
   * Double 413〜455
   *
   * 外形・中心・番号位置・配色は変更しない。
   */

  const tripleOuter =
    307;

  const tripleInner =
    258;


  const doubleInner =
    413;


  const bullOuter =
    70;

  const bullInner =
    31;


  /* 外側の黒い縁 */

  graphics.appendChild(
    createSvgElement(
      'circle',
      {
        cx,
        cy,
        r: outer + 18,
        fill: '#121212',
        stroke: '#2b2b2b',
        'stroke-width': 10
      }
    )
  );


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const number =
      BOARD_NUMBERS[i];

    const centerAngle =
      i * sectorAngle;

    const a1 =
      centerAngle -
      sectorAngle / 2;

    const a2 =
      centerAngle +
      sectorAngle / 2;


    /*
     * ダブル
     */

    const doubleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const doublePath =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              doubleInner,
              outer,
              a1,
              a2
            ),

          fill:
            doubleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            2

        }
      );


    graphics.appendChild(
      doublePath
    );


    /*
     * 外側シングル
     */

    const outerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const outerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleOuter,
              doubleInner,
              a1,
              a2
            ),

          fill:
            outerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            1

        }
      );


    graphics.appendChild(
      outerSingle
    );


    /*
     * トリプル
     */

    const tripleColor =
      i % 2 === 0
        ? '#cf2929'
        : '#218d42';


    const triple =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              tripleInner,
              tripleOuter,
              a1,
              a2
            ),

          fill:
            tripleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            3

        }
      );


    graphics.appendChild(
      triple
    );


    /*
     * 内側シングル
     */

    const innerSingleColor =
      i % 2 === 0
        ? '#101010'
        : '#f2f1eb';


    const innerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              bullOuter,
              tripleInner,
              a1,
              a2
            ),

          fill:
            innerSingleColor,

          stroke:
            '#181818',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            1

        }
      );


    graphics.appendChild(
      innerSingle
    );

  }


  /*
   * ブル
   *
   * 外側：25
   * 内側：50
   */

  graphics.appendChild(
    createSvgElement(
      'circle',
      {
        cx,
        cy,
        r: bullOuter,
        fill: '#218d42',
        stroke: '#171717',
        'stroke-width': 2,
        class: 'board-hit',
        'data-bull': '25'
      }
    )
  );


  graphics.appendChild(
    createSvgElement(
      'circle',
      {
        cx,
        cy,
        r: bullInner,
        fill: '#cf2929',
        stroke: '#171717',
        'stroke-width': 2,
        class: 'board-hit',
        'data-bull': '50'
      }
    )
  );


  /*
   * 番号
   */

  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const angle =
      i * sectorAngle;

    const p =
      polarPoint(
        cx,
        cy,
        478,
        angle
      );


    const text =
      createSvgElement(
        'text',
        {

          x: p.x,

          y: p.y,

          fill:
            '#f5f5f5',

          'font-size':
            48,

          'font-weight':
            900,

          'font-family':
            'Arial, sans-serif',

          'text-anchor':
            'middle',

          'dominant-baseline':
            'middle',

          'pointer-events':
            'none'

        }
      );


    text.textContent =
      number;


    graphics.appendChild(
      text
    );

  }


  /*
   * SVG全体をタッチ座標で判定。
   */

  svg.addEventListener(
    'pointerdown',
    handleBoardPointer
  );

}


/* =========================================================
   ダーツボード座標判定
========================================================= */

function handleBoardPointer(
  event
) {

  if (
    gameFinished ||
    !players.length ||
    currentTurnIndex < 0
  ) {

    return;

  }


  /*
   * 外れボタンなどSVG外の操作は無視。
   */

  if (
    event.target &&
    event.target.tagName !== 'svg' &&
    !event.target.closest('.board-hit')
  ) {

    return;

  }


  const svg =
    document.getElementById(
      'dartboard'
    );

  const rect =
    svg.getBoundingClientRect();


  const x =
    (
      event.clientX -
      rect.left
    ) *
    1000 /
    rect.width;


  const y =
    (
      event.clientY -
      rect.top
    ) *
    1000 /
    rect.height;


  const dx =
    x - 500;

  const dy =
    y - 500;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
   * ボード外。
   */

  if (
    distance >
    475
  ) {

    return;

  }


  let score = 0;

  let soundType = 'normal';

  let label = 'SINGLE';


  /*
   * ダブルブル
   */

  if (
    distance <= bullInner
  ) {

    score = 50;

    label = 'DOUBLE BULL';

    soundType =
      'doubleBull';

  }


  /*
   * ブル
   */

  else if (
    distance <= bullOuter
  ) {

    score = 25;

    label = 'BULL';

    soundType =
      'bull';

  }


  else {

    /*
     * atan2の向きを20の位置が上になるように
     * 正確に合わせる。
     */

    let angle =
      Math.atan2(
        dx,
        -dy
      ) *
      180 /
      Math.PI;


    if (
      angle < 0
    ) {

      angle += 360;

    }


    /*
     * 各セクターの中央が
     * 20,1,18...になるように
     * 最も近いセクターを選択。
     */

    let index =
      Math.floor(
        (
          angle +
          sectorAngle / 2
        ) /
        sectorAngle
      ) % 20;


    const number =
      BOARD_NUMBERS[index];


    /*
     * リング判定。
     *
     * 見た目と同じ境界を使用。
     */

    if (
      distance >=
      doubleInner
    ) {

      score =
        number * 2;

      label =
        'DOUBLE';

      soundType =
        'double';

    }

    else if (
      distance >=
      tripleInner &&
      distance <
      tripleOuter
    ) {

      score =
        number * 3;

      label =
        'TRIPLE';

      soundType =
        'triple';

    }

    else {

      score =
        number;

      label =
        'SINGLE';

      soundType =
        'normal';

    }

  }


  registerHit(
    score,
    label,
    soundType
  );

}


/* =========================================================
   外れ
========================================================= */

function registerMiss() {

  if (
    gameFinished ||
    !players.length
  ) {

    return;

  }

  registerHit(
    0,
    'MISS',
    'miss'
  );

}


/* =========================================================
   入力履歴保存
========================================================= */

function saveActionHistory() {

  actionHistory.push(
    JSON.parse(
      JSON.stringify({
        players:
          players,

        currentTurnIndex:
          currentTurnIndex,

        remainingThrows:
          remainingThrows,

        currentRound:
          currentRound,

        gameFinished:
          gameFinished,

        hitMarkers:
          hitMarkers
      })
    )
  );


  /*
   * 無制限に履歴を残さない。
   */

  if (
    actionHistory.length >
    100
  ) {

    actionHistory.shift();

  }

}


/* =========================================================
   一つ前の入力に戻る
========================================================= */

function undoLastInput() {

  if (
    !actionHistory.length
  ) {

    alert(
      '戻せる入力がありません。'
    );

    return;

  }


  const previous =
    actionHistory.pop();


  players =
    previous.players || [];

  currentTurnIndex =
    Number(
      previous.currentTurnIndex || 0
    );

  remainingThrows =
    Number(
      previous.remainingThrows || 0
    );

  currentRound =
    Number(
      previous.currentRound || 1
    );

  gameFinished =
    Boolean(
      previous.gameFinished
    );

  hitMarkers =
    previous.hitMarkers || [];


  closeRanking();


  broadcastStateToFirebase(
    false,
    ''
  );


  renderInputState();

  renderOutputState();

}


/* =========================================================
   得点登録
========================================================= */

function registerHit(
  score,
  label,
  soundType
) {

  if (
    gameFinished ||
    !players.length
  ) {

    return;

  }


  const player =
    players[
      currentTurnIndex
    ];

  if (!player) return;


  /*
   * 投球数が0なら入力不可。
   */

  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    showTurnChangeEffect(
      'Player Change'
    );

    playSound(
      'playerChange'
    );

    return;

  }


  /*
   * 入力前状態を保存。
   * プレイヤーチェンジが発生しても
   * ここから完全に戻せる。
   */

  saveActionHistory();


  player.score =
    Number(
      player.score || 0
    ) +
    Number(score || 0);


  player.remainingThrows =
    Math.max(
      0,
      Number(
        player.remainingThrows || 0
      ) - 1
    );


  remainingThrows =
    player.remainingThrows;


  hitMarkers.push({

    score:
      score,

    label:
      label,

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  });


  /*
   * 得点演出。
   */

  showHitEffect(
    score,
    label
  );


  playSound(
    soundType
  );


  /*
   * 投球終了。
   */

  if (
    player.remainingThrows <= 0
  ) {

    /*
     * まだ他のプレイヤーがいる場合は
     * Player Change。
     */

    if (
      players.length > 1
    ) {

      currentTurnIndex++;

      if (
        currentTurnIndex >=
        players.length
      ) {

        /*
         * 全員終了。
         */

        currentTurnIndex = 0;

        currentRound++;


        /*
         * 1周で終了。
         * 2週目には入らない。
         */

        gameFinished =
          true;

        remainingThrows =
          0;


        broadcastStateToFirebase(
          true,
          'Player Change'
        );

        renderInputState();

        renderOutputState();

        showRanking();

        return;

      }


      remainingThrows =
        players[
          currentTurnIndex
        ].remainingThrows;


      broadcastStateToFirebase(
        true,
        'Player Change'
      );

      renderInputState();

      renderOutputState();

      return;

    }


    /*
     * プレイヤーが1人だけなら
     * そのプレイヤーの投球終了でゲーム終了。
     */

    gameFinished =
      true;

    remainingThrows =
      0;


    broadcastStateToFirebase(
      true,
      'Player Change'
    );

    renderInputState();

    renderOutputState();

    showRanking();

    return;

  }


  /*
   * まだ投球可能。
   */

  broadcastStateToFirebase();

  renderInputState();

  renderOutputState();

}


/* =========================================================
   次のプレイヤー
========================================================= */

function nextPlayer() {

  if (
    gameFinished ||
    !players.length
  ) {

    return;

  }


  currentTurnIndex++;


  if (
    currentTurnIndex >=
    players.length
  ) {

    /*
     * 1周終了。
     */

    currentTurnIndex =
      0;

    gameFinished =
      true;

    remainingThrows =
      0;


    broadcastStateToFirebase(
      true,
      'Player Change'
    );

    renderInputState();

    renderOutputState();

    showRanking();

    return;

  }


  remainingThrows =
    players[
      currentTurnIndex
    ].remainingThrows;


  broadcastStateToFirebase(
    true,
    'Player Change'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   入力画面表示
========================================================= */

function renderInputState() {

  const player =
    players[
      currentTurnIndex
    ];


  document.getElementById(
    'input-current-player'
  ).textContent =
    player
      ? player.name
      : '-';


  document.getElementById(
    'input-current-score'
  ).textContent =
    player
      ? player.score
      : '0';


  document.getElementById(
    'input-throw-count'
  ).textContent =
    player
      ? (
          '残り投球数：' +
          player.remainingThrows
        )
      : '残り投球数：-';


  renderInputPlayerList();

}


/* =========================================================
   入力画面プレイヤー一覧
========================================================= */

function renderInputPlayerList() {

  const container =
    document.getElementById(
      'input-player-list'
    );

  container.innerHTML = '';


  if (!players.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      '投球者が登録されていません' +
      '</div>';

    return;

  }


  players.forEach(
    (player, index) => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'input-player-item' +
        (
          index ===
          currentTurnIndex
            ? ' current'
            : ''
        );


      row.innerHTML = `

        <div
          class="input-player-item-name">
          ${escapeHtml(player.name)}
        </div>

        <div>
          <div
            class="input-player-item-score">
            ${Number(player.score || 0)}
          </div>

          <div
            class="input-player-item-throws">
            残り ${Number(player.remainingThrows || 0)} 投
          </div>
        </div>

      `;


      container.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   出力画面表示
========================================================= */

function renderOutputState() {

  const current =
    players[
      currentTurnIndex
    ];


  const currentDisplay =
    document.getElementById(
      'current-display'
    );


  currentDisplay
    .classList
    .toggle(
      'current-glow',
      Boolean(
        current &&
        !gameFinished
      )
    );


  if (!current) {

    document.getElementById(
      'output-player-name'
    ).textContent =
      '-';

    document.getElementById(
      'output-score'
    ).textContent =
      '0';

    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：-';

  } else {

    document.getElementById(
      'output-player-name'
    ).textContent =
      current.name;

    document.getElementById(
      'output-score'
    ).textContent =
      current.score;

    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：' +
      current.remainingThrows;

  }


  /*
   * 現在プレイヤーを含めて
   * 全員を下側に表示。
   */

  const container =
    document.getElementById(
      'other-players'
    );

  container.innerHTML = '';


  if (!players.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      '他のプレイヤーはいません' +
      '</div>';

    return;

  }


  players.forEach(
    (player, index) => {

      const card =
        document.createElement(
          'div'
        );

      card.className =
        'other-player-card' +
        (
          index ===
          currentTurnIndex
            ? ' current'
            : ''
        );


      card.innerHTML = `

        <div class="other-player-name">
          ${escapeHtml(player.name)}
          ${
            index === currentTurnIndex
              ? '　●'
              : ''
          }
        </div>

        <div class="other-player-score">
          ${Number(player.score || 0)}
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  /*
   * ランキング表示状態なら
   * 現在表示を固定。
   */

  if (
    gameFinished
  ) {

    currentDisplay
      .classList
      .remove(
        'current-glow'
      );

  }

}


/* =========================================================
   ランキング
========================================================= */

function showRanking() {

  if (
    !players.length
  ) {

    return;

  }


  const sorted =
    [...players].sort(
      (a, b) =>
        Number(
          b.score || 0
        ) -
        Number(
          a.score || 0
        )
    );


  const container =
    document.getElementById(
      'ranking-list'
    );

  container.innerHTML = '';


  sorted.forEach(
    (player, index) => {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'ranking-row';


      row.innerHTML = `

        <div class="ranking-rank">
          ${index + 1}
        </div>

        <div class="ranking-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="ranking-score">
          ${Number(player.score || 0)}
        </div>

      `;


      container.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      'ranking-overlay'
    )
    .classList
    .remove(
      'hidden'
    );

}


function closeRanking() {

  document
    .getElementById(
      'ranking-overlay'
    )
    .classList
    .add(
      'hidden'
    );

}


/* =========================================================
   得点演出
========================================================= */

function showHitEffect(
  score,
  label
) {

  const effect =
    document.getElementById(
      'hit-effect'
    );

  const inner =
    document.getElementById(
      'hit-effect-inner'
    );


  if (
    label === 'MISS'
  ) {

    inner.textContent =
      'MISS';

  }

  else {

    inner.textContent =
      score +
      (
        label === 'SINGLE'
          ? ''
          : ' ' + label
      );

  }


  effect.classList.remove(
    'active'
  );

  void effect.offsetWidth;

  effect.classList.add(
    'active'
  );

}


function showTurnChangeEffect(
  text
) {

  const display =
    document.getElementById(
      'current-display'
    );

  if (!display) return;


  display.classList.remove(
    'player-change'
  );

  void display.offsetWidth;

  display.classList.add(
    'player-change'
  );


  /*
   * 出力画面にも
   * 一時的にPlayer Changeを表示。
   */

  if (
    currentDevice === 'output'
  ) {

    const playerName =
      document.getElementById(
        'output-player-name'
      );

    const oldText =
      playerName.textContent;


    playerName.textContent =
      text;


    setTimeout(
      () => {

        if (
          gameFinished
        ) {

          return;

        }

        playerName.textContent =
          oldText;

      },
      1300
    );

  }

}


/* =========================================================
   MP3設定
========================================================= */

const SOUND_INPUTS = {

  normal:
    'sound-normal',

  double:
    'sound-double',

  triple:
    'sound-triple',

  bull:
    'sound-bull',

  doubleBull:
    'sound-double-bull',

  miss:
    'sound-miss',

  playerChange:
    'sound-player-change'

};


Object.entries(
  SOUND_INPUTS
).forEach(
  ([type, elementId]) => {

    document
      .getElementById(
        elementId
      )
      .addEventListener(
        'change',
        function() {

          const file =
            this.files &&
            this.files[0];

          if (!file) return;


          if (
            localSounds[type]
          ) {

            try {

              localSounds[type].pause();

            } catch (e) {}

          }


          const url =
            URL.createObjectURL(
              file
            );

          soundObjectUrls.push(
            url
          );


          localSounds[type] =
            new Audio(url);

          localSounds[type].preload =
            'auto';


          soundConfig[type] =
            file.name;


          /*
           * MP3ファイルそのものは
           * Firebaseには送らない。
           *
           * Firebaseにはファイル名だけを保存。
           * 実際の音声は各端末側で設定する。
           */

          broadcastStateToFirebase();

        }
      );

  }
);


/* =========================================================
   サウンド再生
========================================================= */

function playSound(type) {

  const audio =
    localSounds[type];

  if (!audio) return;


  try {

    audio.currentTime = 0;

    const promise =
      audio.play();

    if (
      promise &&
      typeof promise.catch === 'function'
    ) {

      promise.catch(
        () => {}
      );

    }

  } catch (e) {

    console.warn(
      'Audio playback failed:',
      e
    );

  }

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(str) {

  return String(str)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

========================================================= */

buildDartboard();

hideAllScreens();

document

  )
  .classList
  .remove(
    'hidden'
  );

  );

}
