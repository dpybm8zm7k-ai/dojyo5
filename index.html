<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DARTS SYSTEM</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #ffffff;
    font-family: Arial, "Noto Sans JP", sans-serif;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #181818 0%, #080808 55%, #000000 100%);
}

.center-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.title {
    font-size: clamp(40px, 6vw, 90px);
    font-weight: 900;
    letter-spacing: 0.15em;
    margin-bottom: 50px;
    text-align: center;
}

.subtitle {
    color: #888;
    font-size: 18px;
    margin-top: -35px;
    margin-bottom: 40px;
}

/* =========================================================
   最初の選択
========================================================= */

.device-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(250px, 400px));
    gap: 25px;
    width: min(90vw, 850px);
}

.main-choice {
    min-height: 180px;
    border: 2px solid #333;
    border-radius: 20px;
    background: linear-gradient(145deg, #191919, #080808);
    color: white;
    font-size: clamp(25px, 3vw, 42px);
    font-weight: bold;
    transition: 0.15s;
}

.main-choice:active {
    transform: scale(0.96);
}

.main-choice:hover {
    border-color: #777;
    background: linear-gradient(145deg, #242424, #101010);
}

/* =========================================================
   入出力選択
========================================================= */

.io-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 430px));
    gap: 30px;
}

.io-choice {
    width: 350px;
    height: 230px;
    border-radius: 25px;
    border: 2px solid #444;
    background: #111;
    color: #fff;
    font-size: 34px;
    font-weight: bold;
}

.io-choice:active {
    transform: scale(0.96);
}

.back-button {
    margin-top: 35px;
    border: 1px solid #444;
    background: #111;
    color: #aaa;
    padding: 12px 30px;
    border-radius: 10px;
    font-size: 16px;
}

/* =========================================================
   入力画面
========================================================= */

.input-screen {
    display: grid;
    grid-template-columns: minmax(520px, 1fr) 350px;
    width: 100%;
    height: 100%;
}

.board-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    overflow: hidden;
}

.dartboard {
    position: relative;
    width: min(78vh, 72vw);
    height: min(78vh, 72vw);
    max-width: 850px;
    max-height: 850px;
    border-radius: 50%;
    background: #050505;
    box-shadow:
        0 0 0 12px #222,
        0 0 0 16px #080808,
        0 0 60px rgba(255,255,255,0.08);
    user-select: none;
}

.board-ring {
    position: absolute;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.board-outer {
    width: 100%;
    height: 100%;
    border: 2px solid #888;
}

.board-double {
    width: 91%;
    height: 91%;
    border: 3px solid #d0d0d0;
}

.board-triple {
    width: 58%;
    height: 58%;
    border: 3px solid #d0d0d0;
}

.board-bull-outer {
    width: 29%;
    height: 29%;
    border: 3px solid #aaa;
}

.board-bull {
    width: 15%;
    height: 15%;
    border: 3px solid #aaa;
}

/*
   20分割のボタン

   本来のダーツボードの色を維持しながら、
   ボタン自体は少し広めの扇形領域にして
   タップしやすくしている。
*/

.board-sector {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46%;
    height: 46%;
    transform-origin: 0% 0%;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    opacity: 0;
    z-index: 20;
}

.board-number {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 0 0;
    width: 50%;
    height: 50%;
    pointer-events: none;
    z-index: 30;
}

.board-number span {
    position: absolute;
    font-size: clamp(15px, 2.3vw, 32px);
    font-weight: 900;
    color: white;
    text-shadow: 0 2px 4px black;
}

.bull-button {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    width: 29%;
    height: 29%;
    background: transparent;
    z-index: 50;
}

.bull-button-inner {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 15%;
    height: 15%;
    border-radius: 50%;
    z-index: 51;
}

/* =========================================================
   右側コントロール
========================================================= */

.control-panel {
    background: #0d0d0d;
    border-left: 1px solid #292929;
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.panel-title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 12px;
}

.room-label {
    color: #888;
    font-size: 15px;
    margin-bottom: 15px;
}

.current-player {
    background: #171717;
    border: 1px solid #333;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.current-player-label {
    color: #888;
    font-size: 13px;
}

.current-player-name {
    font-size: 32px;
    font-weight: bold;
    margin-top: 4px;
}

.score-box {
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;

    font-weight: 900;
    font-size: 64px;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    background: #050505;
    border: 1px solid #333;
    margin-bottom: 10px;
}

.throws-box {
    text-align: center;
    padding: 12px;
    background: #151515;
    border-radius: 12px;
    margin-bottom: 15px;
}

.throws-number {
    font-size: 38px;
    font-weight: bold;
}

.small-label {
    color: #888;
    font-size: 13px;
}

.players-container {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 3px;
}

.player-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 9px;
    margin-bottom: 7px;
}

.player-row.active {
    border-color: #ddd;
}

.player-index {
    width: 30px;
    color: #777;
}

.player-info {
    flex: 1;
}

.player-name {
    font-weight: bold;
}

.player-score {
    color: #bbb;
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    font-weight: bold;
}

.player-select {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 6px 9px;
    border-radius: 7px;
}

.control-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.control-button {
    min-height: 48px;
    border-radius: 9px;
    border: 1px solid #444;
    background: #191919;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.control-button:active {
    transform: scale(0.97);
}

.danger-button {
    border-color: #633;
}

.reset-button {
    grid-column: span 2;
    border-color: #666;
}

.end-button {
    margin-top: 8px;
    min-height: 45px;
    background: #101010;
    border: 1px solid #555;
    color: #aaa;
    border-radius: 8px;
}

/* =========================================================
   プレイヤー追加モーダル
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

.modal-box {
    width: min(90vw, 450px);
    background: #151515;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 25px;
}

.modal-box h2 {
    margin-top: 0;
}

.text-input,
.number-input {
    width: 100%;
    background: #080808;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 13px;
    font-size: 18px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-buttons button {
    flex: 1;
    padding: 13px;
    border-radius: 8px;
    background: #222;
    color: white;
    border: 1px solid #444;
}

/* =========================================================
   得点演出
========================================================= */

.score-effect {
    position: fixed;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%) scale(0.3);
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    font-size: clamp(90px, 15vw, 220px);
    font-weight: 900;
    color: white;
    text-shadow:
        0 0 15px rgba(255,255,255,0.8),
        0 0 50px rgba(255,255,255,0.4);
    pointer-events: none;
    opacity: 0;
    z-index: 1000;
}

.score-effect.show {
    animation: scorePop 0.9s ease-out forwards;
}

@keyframes scorePop {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
    }

    20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
    }

    45% {
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -65%) scale(1.05);
    }
}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(circle at center, #181818 0%, #050505 65%, #000 100%);
}

.output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 35px;
    border-bottom: 1px solid #222;
}

.output-room {
    font-size: 28px;
    font-weight: bold;
}

.output-status {
    color: #777;
}

.output-content {
    flex: 1;
    min-height: 0;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.output-current {
    text-align: center;
    padding: 15px;
}

.output-player-label {
    color: #888;
    font-size: clamp(20px, 2vw, 30px);
}

.output-player {
    font-size: clamp(55px, 8vw, 120px);
    font-weight: 900;
    margin-top: 5px;
}

.output-score {
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;

    font-size: clamp(110px, 18vw, 270px);
    line-height: 0.95;
    font-weight: 900;
    text-shadow: 0 4px 15px rgba(255,255,255,0.15);
}

.output-throws {
    font-size: clamp(28px, 4vw, 60px);
    font-weight: bold;
    margin-top: 10px;
}

.output-players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    width: 100%;
}

.output-player-card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
}

.output-player-card.active {
    border-color: #aaa;
}

.output-card-name {
    font-size: 20px;
    font-weight: bold;
}

.output-card-score {
    margin-top: 8px;
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    font-size: 38px;
    font-weight: 900;
}

.output-card-throws {
    color: #888;
    margin-top: 4px;
}

.output-footer {
    display: flex;
    justify-content: center;
    padding: 12px;
}

.output-back {
    background: #111;
    color: #777;
    border: 1px solid #333;
    border-radius: 7px;
    padding: 9px 20px;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-screen {
    width: 100vw;
    height: 100vh;
    overflow-y: auto;
    background:
        radial-gradient(circle at center top, #171717 0%, #050505 70%);
    padding: 30px;
}

.staff-inner {
    max-width: 1100px;
    margin: 0 auto;
}

.staff-title {
    font-size: clamp(35px, 5vw, 70px);
    font-weight: 900;
    margin-bottom: 10px;
}

.staff-description {
    color: #777;
    margin-bottom: 30px;
}

.staff-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.room-card {
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 20px;
}

.room-card h2 {
    margin-top: 0;
}

.coin-total {
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    font-size: 65px;
    font-weight: 900;
    text-align: center;
    margin: 10px 0;
}

.throw-total {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
}

.staff-button {
    width: 100%;
    min-height: 50px;
    border-radius: 9px;
    border: 1px solid #444;
    background: #1b1b1b;
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin-top: 8px;
}

.staff-button:active {
    transform: scale(0.98);
}

.rule-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}

.rule-table th,
.rule-table td {
    border: 1px solid #333;
    padding: 8px;
}

.rule-table input {
    width: 100%;
}

.staff-data {
    margin-top: 15px;
    padding: 12px;
    background: #080808;
    border-radius: 8px;
    color: #999;
    font-size: 13px;
}

@media (max-width: 800px) {

    .device-grid,
    .io-grid {
        grid-template-columns: 1fr;
        width: 85vw;
    }

    .main-choice {
        min-height: 120px;
    }

    .io-choice {
        width: 85vw;
        height: 140px;
    }

    .input-screen {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
    }

    .dartboard {
        width: min(82vw, 65vh);
        height: min(82vw, 65vh);
    }

    .control-panel {
        border-left: 0;
        border-top: 1px solid #292929;
        max-height: 42vh;
        padding: 10px;
    }

    .score-box {
        font-size: 45px;
    }

    .current-player-name {
        font-size: 24px;
    }

    .staff-grid {
        grid-template-columns: 1fr;
    }

    .staff-screen {
        padding: 15px;
    }

    .output-header {
        padding: 12px;
    }

    .output-content {
        padding: 10px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     画面1：最初の選択
===================================================== -->

<section id="startScreen" class="screen center-screen">

    <div class="title">
        DARTS
    </div>

    <div class="subtitle">
        SYSTEM
    </div>

    <div class="device-grid">

        <button class="main-choice"
                onclick="selectBoard(1)">
            ダーツボード1
        </button>

        <button class="main-choice"
                onclick="selectBoard(2)">
            ダーツボード2
        </button>

        <button class="main-choice"
                onclick="selectStaff('A')">
            スタッフA
        </button>

        <button class="main-choice"
                onclick="selectStaff('B')">
            スタッフB
        </button>

    </div>

</section>


<!-- =====================================================
     画面2：入力 / 出力
===================================================== -->

<section id="ioScreen"
         class="screen center-screen hidden">

    <div class="title">
        DARTS BOARD <span id="selectedBoardText"></span>
    </div>

    <div class="io-grid">

        <button class="io-choice"
                onclick="openInputDevice()">
            入力デバイス
        </button>

        <button class="io-choice"
                onclick="openOutputDevice()">
            出力デバイス
        </button>

    </div>

    <button class="back-button"
            onclick="goHome()">
        戻る
    </button>

</section>


<!-- =====================================================
     入力デバイス
===================================================== -->

<section id="inputScreen"
         class="screen hidden">

    <div class="input-screen">

        <div class="board-area">

            <div id="dartboard"
                 class="dartboard">

                <div class="board-ring board-outer"></div>
                <div class="board-ring board-double"></div>
                <div class="board-ring board-triple"></div>
                <div class="board-ring board-bull-outer"></div>
                <div class="board-ring board-bull"></div>

                <div id="sectorButtons"></div>
                <div id="numberLabels"></div>

                <button class="bull-button"
                        onclick="scoreBull(false)">
                </button>

                <button class="bull-button-inner"
                        onclick="scoreBull(true)">
                </button>

            </div>

        </div>


        <div class="control-panel">

            <div class="panel-title">
                DARTS CONTROL
            </div>

            <div id="inputRoomLabel"
                 class="room-label">
                ダーツボード
            </div>

            <div class="current-player">

                <div class="current-player-label">
                    CURRENT PLAYER
                </div>

                <div id="currentPlayerName"
                     class="current-player-name">
                    プレイヤー1
                </div>

            </div>

            <div id="currentScore"
                 class="score-box">
                0
            </div>

            <div class="throws-box">

                <div class="small-label">
                    残り投球数
                </div>

                <div id="remainingThrows"
                     class="throws-number">
                    0
                </div>

            </div>

            <div id="playersContainer"
                 class="players-container">
            </div>

            <div class="control-buttons">

                <button class="control-button"
                        onclick="openAddPlayer()">
                    プレイヤー追加
                </button>

                <button class="control-button danger-button"
                        onclick="removePlayer()">
                    プレイヤー削除
                </button>

                <button class="control-button reset-button"
                        onclick="resetScores()">
                    点数リセット
                </button>

            </div>

            <button class="end-button"
                    onclick="goHome()">
                終了
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     出力デバイス
===================================================== -->

<section id="outputScreen"
         class="screen hidden">

    <div class="output-screen">

        <header class="output-header">

            <div id="outputRoom"
                 class="output-room">
                ダーツボード
            </div>

            <div class="output-status">
                LIVE
            </div>

        </header>

        <main class="output-content">

            <div class="output-current">

                <div class="output-player-label">
                    PLAYER
                </div>

                <div id="outputPlayer"
                     class="output-player">
                    プレイヤー1
                </div>

                <div id="outputScore"
                     class="output-score">
                    0
                </div>

                <div class="output-throws">
                    残り <span id="outputThrows">0</span> 投
                </div>

            </div>

            <div id="outputPlayers"
                 class="output-players">
            </div>

        </main>

        <footer class="output-footer">

            <button class="output-back"
                    onclick="goHome()">
                終了
            </button>

        </footer>

    </div>

</section>


<!-- =====================================================
     スタッフ画面
===================================================== -->

<section id="staffScreen"
         class="staff-screen hidden">

    <div class="staff-inner">

        <div id="staffTitle"
             class="staff-title">
            スタッフ
        </div>

        <div class="staff-description">
            コイン合計からダーツの投球数を決定します。
        </div>

        <div class="staff-grid">

            <div class="room-card">

                <h2>
                    ダーツルーム1
                </h2>

                <div class="small-label">
                    コイン合計
                </div>

                <div id="room1Coin"
                     class="coin-total">
                    0
                </div>

                <input id="room1CoinInput"
                       class="number-input"
                       type="number"
                       min="0"
                       step="1"
                       placeholder="コイン枚数">

                <div class="throw-total">
                    投球数：
                    <strong id="room1Throws">
                        0
                    </strong>
                    投
                </div>

                <button class="staff-button"
                        onclick="saveStaffData(1)">
                    ダーツルーム1に保存
                </button>

                <button class="staff-button"
                        onclick="loadStaffDataForRoom(1)">
                    保存済みデータを読み込む
                </button>

                <div id="room1Data"
                     class="staff-data">
                    未保存
                </div>

            </div>


            <div class="room-card">

                <h2>
                    ダーツルーム2
                </h2>

                <div class="small-label">
                    コイン合計
                </div>

                <div id="room2Coin"
                     class="coin-total">
                    0
                </div>

                <input id="room2CoinInput"
                       class="number-input"
                       type="number"
                       min="0"
                       step="1"
                       placeholder="コイン枚数">

                <div class="throw-total">
                    投球数：
                    <strong id="room2Throws">
                        0
                    </strong>
                    投
                </div>

                <button class="staff-button"

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    update,
    onValue
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* ======================================================
   Firebase設定
======================================================

   ↓↓↓ 自分のFirebaseプロジェクトの値に変更 ↓↓↓
====================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
        "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
        "YOUR_PROJECT",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


/* ======================================================
   Firebase初期化
====================================================== */

let firebaseReady = false;
let db = null;

try {

    const app = initializeApp(firebaseConfig);

    db = getDatabase(app);

    firebaseReady = true;

} catch (error) {

    console.warn(
        "Firebase initialization failed:",
        error
    );

}


/* ======================================================
   グローバル状態
====================================================== */

let selectedBoard = null;

let selectedDevice = null;

let selectedStaff = null;

let gameListener = null;

let staffListener = null;

let gameState = {

    players: [],

    currentPlayer: 0,

    currentThrow: 0,

    maxThrows: 0,

    gameStarted: false

};


/* ======================================================
   コイン → 投球数
======================================================

   必要に応じてここを変更。

   例：
   1～9   → 3投
   10～19 → 6投
   20～29 → 9投
   30～39 → 12投
   40～   → 15投
====================================================== */

let throwRules = [

    {
        min: 1,
        max: 9,
        throws: 3
    },

    {
        min: 10,
        max: 19,
        throws: 6
    },

    {
        min: 20,
        max: 29,
        throws: 9
    },

    {
        min: 30,
        max: 39,
        throws: 12
    },

    {
        min: 40,
        max: 999999,
        throws: 15
    }

];


/* ======================================================
   Firebase utility
====================================================== */

async function firebaseSet(path, data) {

    if (!firebaseReady) {
        return;
    }

    try {

        await set(
            ref(db, path),
            data
        );

    } catch (error) {

        console.error(error);

    }

}


async function firebaseUpdate(path, data) {

    if (!firebaseReady) {
        return;
    }

    try {

        await update(
            ref(db, path),
            data
        );

    } catch (error) {

        console.error(error);

    }

}


/* ======================================================
   画面切り替え
====================================================== */

function hideAllScreens() {

    document
        .querySelectorAll(".screen")
        .forEach(element => {
            element.classList.add("hidden");
        });

}


function goHome() {

    hideAllScreens();

    document
        .getElementById("startScreen")
        .classList.remove("hidden");

    selectedBoard = null;
    selectedDevice = null;

}


window.goHome = goHome;


/* ======================================================

function selectBoard(boardNumber) {

/* ======================================================

function openInputDevice() {

        .getElementById("inputScreen")

window.openInputDevice = openInputDevice;


/* ======================================================
   出力デバイス
====================================================== */

function openOutputDevice() {

    selectedDevice = "output";

    hideAllScreens();

    document
        .getElementById("outputScreen")
        .classList.remove("hidden");

        .getElementById("outputRoom")

    loadGameFromFirebase();

}


window.openOutputDevice = openOutputDevice;


/* ======================================================
   Firebaseゲーム同期
====================================================== */

function loadGameFromFirebase() {

    if (!firebaseReady) {
        return;
    }

    if (gameListener) {
        gameListener();
        gameListener = null;
    }

    const path =
        "darts/boards/board" +
        selectedBoard +
        "/game";

    gameListener = onValue(
        ref(db, path),
        snapshot => {

            const data = snapshot.val();

            if (!data) {
                return;
            }

            gameState = {

                players:
                    Array.isArray(data.players)
                        ? data.players
                        : [],

                currentPlayer:
                    Number(data.currentPlayer || 0),

                currentThrow:
                    Number(data.currentThrow || 0),

                maxThrows:
                    Number(data.maxThrows || 0),

                gameStarted:
                    Boolean(data.gameStarted)

            };

            renderPlayers();

            updateInputDisplay();

            updateOutputDisplay();

        }
    );

}


/* ======================================================
   ゲームFirebase保存
====================================================== */

async function saveGame() {

    const path =
        "darts/boards/board" +
        selectedBoard +
        "/game";

    await firebaseSet(
        path,
        gameState
    );

}


/* ======================================================
   初期ゲーム作成
====================================================== */

async function createInitialGame() {

    gameState = {

        players: [

            {
                name: "プレイヤー1",
                score: 0,
                remainingThrows: 0
            }

        ],

        currentPlayer: 0,

        currentThrow: 0,

        maxThrows: 0,

        gameStarted: false

    };

    await saveGame();

}


/* ======================================================
   プレイヤー追加
====================================================== */

function openAddPlayer() {

    document
        .getElementById("addPlayerModal")
        .classList.remove("hidden");

    document
        .getElementById("newPlayerName")
        .value = "";

    document
        .getElementById("newPlayerName")
        .focus();

}


window.openAddPlayer = openAddPlayer;


function closeAddPlayer() {

    document
        .getElementById("addPlayerModal")
        .classList.add("hidden");

}


window.closeAddPlayer = closeAddPlayer;


async function addPlayer() {

    const input =
        document.getElementById("newPlayerName");

    let name =
        input.value.trim();

    if (!name) {

        name =
            "プレイヤー" +
            (gameState.players.length + 1);

    }

    gameState.players.push({

        name: name,

        score: 0,

        remainingThrows:
            gameState.maxThrows

    });

    await saveGame();

    closeAddPlayer();

}


window.addPlayer = addPlayer;


/* ======================================================
   プレイヤー削除
====================================================== */

async function removePlayer() {

    if (gameState.players.length <= 1) {
        return;
    }

    gameState.players.splice(
        gameState.currentPlayer,
        1
    );

    if (
        gameState.currentPlayer >=
        gameState.players.length
    ) {

        gameState.currentPlayer =
            gameState.players.length - 1;

    }

    await saveGame();

}


window.removePlayer = removePlayer;


/* ======================================================
   点数リセット
====================================================== */

async function resetScores() {

    gameState.players.forEach(player => {

        player.score = 0;

        player.remainingThrows =
            gameState.maxThrows;

    });

    gameState.currentPlayer = 0;
    gameState.currentThrow = 0;

    await saveGame();

}


window.resetScores = resetScores;


/* ======================================================
   プレイヤー選択
====================================================== */

async function selectPlayer(index) {

    if (
        index < 0 ||
        index >= gameState.players.length
    ) {
        return;
    }

    gameState.currentPlayer = index;

    gameState.currentThrow = 0;

    await saveGame();

}


/* ======================================================
   得点処理
====================================================== */

async function score(value, multiplier) {

    if (
        gameState.players.length === 0
    ) {
        return;
    }

    const player =
        gameState.players[
            gameState.currentPlayer
        ];

    if (!player) {
        return;
    }

    const points =
        value * multiplier;

    player.score += points;

    gameState.currentThrow++;

    player.remainingThrows =
        Math.max(
            0,
            gameState.maxThrows -
            gameState.currentThrow
        );

    showScoreEffect(points);

    playScoreSound();

    await saveGame();

}

async function scoreBull(inner) {

    if (inner) {

        await score(50, 1);

    } else {

        await score(25, 1);

}

/* ======================================================

function updateInputDisplay() {

/* ======================================================
   XSS対策
====================================================== */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

   得点演出
====================================================== */

function showScoreEffect(points) {

    const effect =
        document.getElementById(

    effect.textContent =

    effect.classList.remove("show");

    void effect.offsetWidth;

    effect.classList.add("show");

}


/* ======================================================
   MP3
======================================================

   選択したMP3はブラウザのlocalStorageに保存。

   将来的にはFirebase Storageに置けば、
   入力デバイスと出力デバイスで
   同じ音源を共有できる。
====================================================== */

let scoreSoundData =
    localStorage.getItem(
        "dartsScoreSound"
    );


function playScoreSound() {

    if (!scoreSoundData) {
        return;
    }

    try {

        const audio =
            new Audio(
                scoreSoundData
            );

        audio.volume = 1.0;

        audio.play().catch(
            () => {}
        );

    } catch (error) {

        console.warn(error);

    }

}


/* ======================================================
   MP3選択UI
====================================================== */

function createSoundSelector() {

    const input =
        document.createElement("input");

    input.type =
        "file";

    input.accept =
        "audio/mpeg,audio/mp3";

    input.style.position =
        "fixed";

    input.style.bottom =
        "10px";

    input.style.left =
        "10px";

    input.style.zIndex =
        "3000";

    input.style.background =
        "#111";

    input.style.color =
        "white";

    input.onchange =
        event => {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    scoreSoundData =
                        reader.result;

                    localStorage.setItem(
                        "dartsScoreSound",
                        scoreSoundData
                    );

                    alert(
                        "MP3を設定しました。"
                    );

                };

            reader.readAsDataURL(file);

        };

    document.body.appendChild(input);

}

function loadStaffData() {

    }

    const path =
        "darts/staff/staff" +

   スタッフデータ表示
====================================================== */

function updateStaffRoomDisplay(
    room,
    data
) {

    if (!data) {
        return;
    }

    const coinElement =
        document.getElementById(
            "room" + room + "Coin"
        );

    const throwElement =
        document.getElementById(
            "room" + room + "Throws"
        );

    const dataElement =
        document.getElementById(
            "room" + room + "Data"
        );

    }

    if (throwElement) {

        throwElement.textContent =
            data.throws ?? 0;

    }

    if (dataElement) {

        dataElement.textContent =
            "保存日時：" +
            (
                data.savedAt
                    ? new Date(
                        data.savedAt
                    ).toLocaleString()
                    : "-"
            ) +
            " / 投球数：" +
            (data.throws ?? 0);

    }

}


/* ======================================================
   スタッフデータ保存
====================================================== */

async function saveStaffData(room) {

    const input =
        document.getElementById(
            "room" +
            room +
            "CoinInput"
        );

    const coins =
        Math.max(
            0,
            Number(
                input.value || 0
            )
        );

    const throws =
        calculateThrows(
            coins
        );

    const data = {

        coins: coins,

        throws: throws,

        savedAt:
            Date.now(),

        staff:
            selectedStaff

    };

    await firebaseSet(
        "darts/staff/staff" +
        selectedStaff +
        "/room" +
        room,
        data
    );

    updateStaffRoomDisplay(
        room,
        data
    );

}


/* ======================================================
   投球数計算
====================================================== */

function calculateThrows(coins) {

    if (coins <= 0) {
        return 0;
    }

    for (
        const rule of throwRules
    ) {

        if (
            coins >= rule.min &&
            coins <= rule.max
        ) {

            return rule.throws;

        }

    }

    return 0;

}

/* ======================================================
   スタッフデータを読み込んでゲーム開始
====================================================== */

async function loadStaffDataForRoom(room) {

    if (!firebaseReady) {

        alert(
            "Firebaseが設定されていません。"
        );

        return;

    }

    const path =
        "darts/staff/staff" +
        selectedStaff +
        "/room" +
        room;

    /*
     * 一度だけ読み込む。
     *
     * 重要：
     * ここで取得した throws を
     * ゲームデータへコピーする。
     *
     * その後スタッフ側のデータが変更されても
     * game.maxThrows は変更されない。
     */

    const snapshot =
        await new Promise(
            resolve => {

                onValue(
                    ref(db, path),
                    resolve,
                    {
                        onlyOnce: true
                    }
                );

            }
        );

    const data =
        snapshot.val();

    if (!data) {

        alert(
            "保存されたスタッフデータがありません。"
        );

        return;

    }

    const throws =
        Number(
            data.throws || 0
        );

    if (throws <= 0) {

        alert(
            "投球数が0です。"
        );

        return;

    }


    /*
     * スタッフA/Bのデータを
     * ゲーム側へコピー。
     *
     * ここから先は独立したスナップショット。
     */

    const gamePlayers =
        gameState.players.length > 0
            ? gameState.players
            : [
                {
                    name: "プレイヤー1",
                    score: 0,
                    remainingThrows: throws
                }
            ];

    gameState = {

        players:
            gamePlayers.map(
                player => ({

                    name:
                        player.name,

                    score: 0,

                    remainingThrows:
                        throws

                })
            ),

        currentPlayer: 0,

        currentThrow: 0,

        maxThrows: throws,

        gameStarted: true,

        loadedFromStaff:
            selectedStaff,

        loadedStaffCoins:
            Number(data.coins || 0),

        loadedAt:
            Date.now()

    };

    selectedBoard = room;

    await saveGame();

    alert(
        "ダーツボード" +
        room +
        "に" +
        "スタッフ" +
        selectedStaff +
        "の投球数 " +
        throws +
        " 投を読み込みました。"
    );

}


/* ======================================================
   スタッフルール表示
====================================================== */

function loadStaffRules() {

    const saved =
        localStorage.getItem(
            "dartsThrowRules"
        );

    if (saved) {

        try {

            throwRules =
                JSON.parse(saved);

        } catch (e) {}

    }

    renderRules();

}


function renderRules() {

    const tbody =
        document.getElementById(
            "ruleTable"
        );

    tbody.innerHTML = "";

    throwRules.forEach(
        (rule, index) => {

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

                <td>
                    <input
                        class="number-input"
                        data-rule="${index}"
                        data-type="min"
                        type="number"
                        value="${rule.min}">
                </td>

                <td>
                    <input
                        class="number-input"
                        data-rule="${index}"
                        data-type="max"
                        type="number"
                        value="${rule.max}">
                </td>

                <td>
                    <input
                        class="number-input"
                        data-rule="${index}"
                        data-type="throws"
                        type="number"
                        value="${rule.throws}">
                </td>

            `;

            tbody.appendChild(tr);

        }
    );

}


/* ======================================================
   スタッフルール保存
====================================================== */

function saveRules() {

    const inputs =
        document.querySelectorAll(
            "#ruleTable input"
        );

    const newRules =
        throwRules.map(
            rule => ({
                ...rule
            })
        );

    inputs.forEach(
        input => {

            const index =
                Number(
                    input.dataset.rule
                );

            const type =
                input.dataset.type;

            newRules[index][type] =
                Number(
                    input.value
                );

        }
    );

    throwRules =
        newRules;

    localStorage.setItem(
        "dartsThrowRules",
        JSON.stringify(
            throwRules
        )
    );

    alert(
        "換算ルールを保存しました。"
    );

}
