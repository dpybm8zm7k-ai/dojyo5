<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>DARTS SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
  color: #fff;

  /* 日本語は明朝体を使用しない */
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   共通
========================================================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 28px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.panel {
  width: min(1100px, 100%);
  margin: 0 auto;
}

.title {
  text-align: center;
  font-weight: 900;
  letter-spacing: 0.08em;
}

.main-title {
  font-size: clamp(42px, 8vw, 90px);
  margin: 0 0 14px;

  /* DARTSは英字なのでSerif */
  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 16px;
  margin-bottom: 40px;
}

.selection-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  max-width: 850px;
  margin: 0 auto;
}

.big-button {
  min-height: 150px;
  border: 1px solid #444;
  border-radius: 18px;
  background: #141414;
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 800;
  transition: 0.15s;
}

.big-button:hover {
  background: #222;
  border-color: #888;
}

.big-button:active {
  transform: scale(0.97);
  background: #333;
}

.topbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topbar h2 {
  margin: 0;
  font-size: clamp(28px, 5vw, 50px);
  font-weight: 900;

  /* 日本語なのでゴシック */
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    Arial,
    sans-serif;
}

.back-button {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid #555;
  color: #fff;
  background: #151515;
  font-weight: 700;
}

.back-button:active {
  transform: scale(0.97);
}

.section {
  background: #111;
  border: 1px solid #2c2c2c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 16px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.text-input,
.number-input,
.select-input {
  min-height: 52px;
  padding: 10px 14px;
  background: #050505;
  border: 1px solid #444;
  border-radius: 10px;
  color: #fff;
  outline: none;
}

.text-input:focus,
.number-input:focus,
.select-input:focus {
  border-color: #aaa;
}

.action-button {
  min-height: 52px;
  padding: 10px 20px;
  background: #1c1c1c;
  border: 1px solid #555;
  color: white;
  border-radius: 10px;
  font-weight: 800;
}

.action-button:active {
  transform: scale(0.97);
  background: #333;
}

.danger-button {
  border-color: #722;
  color: #ffb0b0;
}

.primary-button {
  background: #f5f5f5;
  color: #000;
  border-color: #fff;
}

/* =========================================================
   スタッフ画面
========================================================= */

.staff-header {
  text-align: center;
  margin-bottom: 30px;
}

.staff-header h1 {
  font-size: clamp(34px, 6vw, 62px);
  margin: 0;
  font-weight: 900;
}

.staff-header p {
  color: #999;
}

.player-editor-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.staff-player {
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 220px)
    auto;
  align-items: center;
  gap: 12px;
  background: #090909;
  border: 1px solid #292929;
  padding: 14px;
  border-radius: 12px;
}

.staff-player-name {
  font-size: 20px;
  font-weight: 800;
}

.coin-label {
  color: #aaa;
  font-size: 13px;
}

.throw-result {
  color: #ddd;
  font-size: 13px;
}

.coin-total {
  font-size: 30px;
  font-weight: 900;
  margin-top: 8px;
}

.rule-grid {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.rule-item label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

/* =========================================================
   入出力デバイス選択
========================================================= */

.device-grid {
  display: grid;
  grid-template-columns:
    repeat(2, 1fr);
  gap: 20px;
  max-width: 800px;
  margin: 0 auto;
}

.device-button {
  min-height: 190px;
  background: #121212;
  border: 1px solid #444;
  border-radius: 18px;
  color: #fff;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
}

.device-button:active {
  transform: scale(0.97);
  background: #292929;
}

/* =========================================================
   入力画面
========================================================= */

.input-layout {
  display: grid;
  grid-template-columns:
    minmax(320px, 1fr)
    minmax(280px, 420px);
  gap: 25px;
  align-items: start;
}

.board-container {
  width: min(760px, 100%);
  margin: 0 auto;
  position: relative;
  touch-action: none;
}

.board-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  user-select: none;
  touch-action: none;
}

/*
 * ダーツボードの各得点領域。
 * SVG自体ではなく各領域を直接クリック可能にする。
 */
.board-hit {
  cursor: pointer;
  touch-action: none;
}

.board-hit:hover {
  opacity: 0.86;
}

.board-hit:active {
  opacity: 0.65;
}

.current-info {
  background: #101010;
  border: 1px solid #303030;
  border-radius: 15px;
  padding: 18px;
  position: sticky;
  top: 10px;
}

.current-player-label {
  color: #aaa;
  font-size: 14px;
}

.current-player {
  font-size: clamp(30px, 5vw, 50px);
  font-weight: 900;
  margin: 3px 0 12px;
}

.current-score {
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  line-height: 0.9;

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

.throw-count {
  font-size: 20px;
  margin-top: 15px;
  color: #ddd;
}

.staff-select-box {
  margin-bottom: 15px;
}

.staff-select-box label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.staff-select {
  width: 100%;
  min-height: 50px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #444;
  background: #050505;
  color: #fff;
}

.player-controls {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.player-controls button {
  min-height: 52px;
}

.sound-control {
  margin-top: 18px;
}

.sound-control label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 8px;
}

.sound-control input {
  width: 100%;
}

/* =========================================================
   Player Change 表示
========================================================= */

.player-change-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.72);

  pointer-events: none;

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease;
}

.player-change-overlay.active {
  opacity: 1;
  visibility: visible;
}

.player-change-text {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    clamp(60px, 13vw, 170px);

  font-weight: 900;
  letter-spacing: 0.04em;
  text-align: center;

  text-shadow:
    0 0 20px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.35);
}

/* =========================================================
   ヒット演出
========================================================= */

.hit-effect {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
}

.hit-effect.active {
  animation: hitFlash 0.65s ease-out;
}

.hit-effect-inner {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(80px, 18vw, 220px);

  font-weight: 900;

  text-shadow:
    0 0 15px rgba(255,255,255,.7),
    0 0 50px rgba(255,255,255,.4);
}

@keyframes hitFlash {

  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  20% {
    opacity: 1;
    transform: scale(1.1);
  }

  55% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.4);
  }

}

/* =========================================================
   出力画面
========================================================= */

.output-screen {
  padding: 0;
  background: #050505;
  overflow: hidden;
}

.output-layout {
  height: 100vh;
  min-height: 600px;

  display: grid;

  /*
   * 上2/5：現在投球中のプレイヤー
   * 下3/5：その他プレイヤー
   */
  grid-template-rows: 40% 60%;
}

.current-display {
  position: relative;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  border-bottom: 2px solid #292929;

  overflow: hidden;
}

.current-display::before {
  content: "";

  position: absolute;
  inset: 0;

  border: 4px solid transparent;

  pointer-events: none;
}

.current-display.player-change::before {
  animation: currentBorder 1.3s ease-out;
}

@keyframes currentBorder {

  0% {
    border-color: #fff;
  }

  100% {
    border-color: transparent;
  }

}

.output-board-name {
  position: absolute;
  top: 12px;
  left: 20px;

  color: #777;

  font-size: 14px;
  letter-spacing: 0.15em;
}

.output-player-name {
  font-size:
    clamp(30px, 5vw, 70px);

  font-weight: 900;

  margin-bottom: 5px;
}

.output-score {
  /*
   * 点数のみ太い明朝体
   */
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;

  font-weight: 900;

  font-size:
    clamp(100px, 18vw, 250px);

  line-height: 0.9;

  letter-spacing: -0.04em;
}

.output-throws {
  margin-top: 10px;

  font-size:
    clamp(20px, 3vw, 38px);

  color: #ddd;

  font-weight: 700;
}

.other-players {
  padding: 15px 20px 25px;

  overflow-y: auto;

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));

  align-content: start;

  gap: 12px;
}

.other-player-card {
  background: #111;

  border: 1px solid #2b2b2b;

  border-radius: 12px;

  padding: 16px 18px;

  min-height: 100px;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.other-player-name {
  color: #bbb;

  font-size: 17px;

  font-weight: 700;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.other-player-score {
  /*
   * 点数は太い明朝
   */
  font-family:
    "Noto Serif JP",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;

  font-size: 45px;

  font-weight: 900;

  line-height: 1;

  margin-top: 5px;
}

.empty-message {
  color: #555;

  text-align: center;

  padding: 30px;
}

/* =========================================================
   レスポンシブ
========================================================= */

@media (max-width: 800px) {

  .screen {
    padding: 16px;
  }

  .selection-grid,
  .device-grid {
    grid-template-columns: 1fr;
  }

  .input-layout {
    grid-template-columns: 1fr;
  }

  .current-info {
    position: static;
  }

  .staff-player {
    grid-template-columns: 1fr;
  }

  .rule-grid {
    grid-template-columns: 1fr;
  }

  .output-layout {
    grid-template-rows: 40% 60%;
  }

  .other-players {
    grid-template-columns:
      repeat(auto-fit, minmax(160px, 1fr));
  }

}

@media (max-width: 500px) {

  .player-controls {
    grid-template-columns: 1fr;
  }

  .other-player-card {
    min-height: 85px;
  }

}

/* =========================================================
   入力停止状態
========================================================= */

.board-disabled {
  pointer-events: none !important;
  opacity: 0.55;
}

</style>
</head>

<body>

<!-- =======================================================
     画面1：最初の選択
======================================================= -->

<div id="screen-role" class="screen center-screen">

  <div class="panel">

    <h1 class="title main-title">
      DARTS
    </h1>

    <div class="subtitle">
      SELECT SYSTEM
    </div>

    <div class="selection-grid">

      <button
        class="big-button"
        onclick="selectRole('board1')">
        ダーツボード1
      </button>

      <button
        class="big-button"
        onclick="selectRole('board2')">
        ダーツボード2
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffA')">
        スタッフA
      </button>

      <button
        class="big-button"
        onclick="selectRole('staffB')">
        スタッフB
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     画面2：入力 / 出力
======================================================= -->

<div id="screen-device" class="screen center-screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="device-board-title">
        ダーツボード1
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>

    <div class="subtitle">
      DEVICE TYPE
    </div>

    <div class="device-grid">

      <button
        class="device-button"
        onclick="openInputDevice()">
        入力デバイス
      </button>

      <button
        class="device-button"
        onclick="openOutputDevice()">
        出力デバイス
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     スタッフ画面
======================================================= -->

<div id="screen-staff" class="screen hidden">

  <div class="panel">

    <div class="topbar">

      <h2 id="staff-title">
        スタッフA
      </h2>

      <button
        class="back-button"
        onclick="goRoleSelect()">
        戻る
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        プレイヤー管理
      </h3>

      <div class="input-row">

        <input
          id="new-player-name"
          class="text-input"
          type="text"
          placeholder="プレイヤー名">

        <input
          id="new-player-coins"
          class="number-input"
          type="number"
          min="0"
          step="1"
          placeholder="保有コイン">

        <button
          class="action-button primary-button"
          onclick="addStaffPlayer()">
          プレイヤー追加
        </button>

      </div>

    </div>


    <div class="section">

      <h3 class="section-title">
        コイン → 投球数設定
      </h3>

      <div class="rule-grid">

        <div class="rule-item">

          <label>
            1投に必要なコイン
          </label>

          <input
            id="coins-per-throw"
            class="number-input"
            type="number"
            min="1"
            value="10">

        </div>

        <div class="rule-item">

          <label>
            最低投球数
          </label>

          <input
            id="minimum-throws"
            class="number-input"
            type="number"
            min="0"
            value="3">

        </div>

        <div class="rule-item">

          <label>
            最大投球数
          </label>

          <input
            id="maximum-throws"
            class="number-input"
            type="number"
            min="1"
            value="30">

        </div>

      </div>

      <br>

      <button
        class="action-button"
        onclick="saveStaffData()">
        スタッフデータを保存
      </button>

    </div>


    <div class="section">

      <h3 class="section-title">
        登録プレイヤー
      </h3>

      <div
        id="staff-player-list"
        class="player-editor-list">
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     入力デバイス
======================================================= -->

<div id="screen-input" class="screen hidden">

  <div class="topbar">

    <h2 id="input-title">
      ダーツボード1
    </h2>

    <button
      class="back-button"
      onclick="goDeviceSelect()">
      戻る
    </button>

  </div>


  <div class="input-layout">

    <div>

      <div
        id="board-container"
        class="board-container">

        <svg
          id="dartboard"
          class="board-svg"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg">

          <g id="board-graphics"></g>

        </svg>

      </div>

    </div>


    <div>

      <div class="current-info">

        <div class="staff-select-box">

          <label>
            使用するスタッフ
          </label>

          <select
            id="input-staff-select"
            class="staff-select"
            onchange="loadStaffSnapshot()">

            <option value="">
              スタッフを選択
            </option>

            <option value="A">
              スタッフA
            </option>

            <option value="B">
              スタッフB
            </option>

          </select>

        </div>


        <div class="current-player-label">
          投球中
        </div>

        <div
          id="input-current-player"
          class="current-player">
          -
        </div>

        <div
          id="input-current-score"
          class="current-score">
          0
        </div>

        <div
          id="input-throw-count"
          class="throw-count">
          残り投球数：-
        </div>


        <div class="player-controls">

          <button
            class="action-button"
            onclick="addGamePlayer()">
            プレイヤー追加
          </button>

          <button
            class="action-button"
            onclick="removeCurrentPlayer()">
            プレイヤー削除
          </button>

          <button
            class="action-button danger-button"
            onclick="resetGameScore()">
            点数リセット
          </button>

        </div>


        <div class="sound-control">

          <label>
            得点演出MP3
          </label>

          <input
            id="sound-file"
            type="file"
            accept="audio/mpeg,audio/mp3">

        </div>

      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     出力デバイス
======================================================= -->

<div
  id="screen-output"
  class="screen output-screen hidden">

  <div class="output-layout">

    <div
      id="current-display"
      class="current-display">

      <div
        id="output-board-name"
        class="output-board-name">
        DARTS
      </div>

      <div
        id="output-player-name"
        class="output-player-name">
        -
      </div>

      <div
        id="output-score"
        class="output-score">
        0
      </div>

      <div
        id="output-throws"
        class="output-throws">
        残り投球数：-
      </div>

    </div>


    <div
      id="other-players"
      class="other-players">
    </div>

  </div>

</div>


<!-- =======================================================
     得点演出
======================================================= -->

<div id="hit-effect" class="hit-effect">

  <div
    id="hit-effect-inner"
    class="hit-effect-inner">
    0
  </div>

</div>


<!-- =======================================================
     Player Change
======================================================= -->

<div
  id="player-change-overlay"
  class="player-change-overlay">

  <div
    id="player-change-text"
    class="player-change-text">
    Player Change
  </div>

</div>


<script>

/* =========================================================
   Firebase設定
========================================================= */

const FIREBASE_CONFIG = {

  apiKey: "YOUR_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  databaseURL:
    "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "YOUR_PROJECT",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};

let firebaseDb = null;

try {

  if (
    FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" &&
    FIREBASE_CONFIG.databaseURL.indexOf(
      "YOUR_PROJECT"
    ) === -1
  ) {

    firebase.initializeApp(
      FIREBASE_CONFIG
    );

    firebaseDb =
      firebase.database();

  }

} catch (e) {

}

let currentBoard = null;

let currentDevice = null;

let currentChannel = "";

let currentStaff = "";

let staffSnapshot = null;

let players = [];

let currentTurnIndex = 0;

let remainingThrows = 0;

let currentRound = 1;

let maxRounds = 1;

let hitMarkers = [];

let soundConfig = {

  enabled: false,

  fileName: ""

};

let localSoundUrl = null;

let localAudio = null;

let boardInputLocked = false;

window._lastSyncTime = 0;


/* =========================================================
   Firebase チャンネル
========================================================= */

function getFirebaseChannelKey() {

  return encodeURIComponent(
    currentChannel
  ).replace(
    /\./g,
    '%2E'
  );

}


function initFirebaseChannel(
  chName
) {

  if (!firebaseDb) return;

  currentChannel =
    chName;

  const channelRef =
    firebaseDb.ref(
      'darts_channels/' +
      getFirebaseChannelKey()
    );

  channelRef.off();

  window._lastSyncTime = 0;

  channelRef.on(
    'value',
    (snapshot) => {

      const data =
        snapshot.val();

      if (
        !data ||
        !data.timestamp
      ) {
        return;
      }

      if (
        window._lastSyncTime &&
        data.timestamp <=
        window._lastSyncTime
      ) {

        return;

      }

      window._lastSyncTime =
        data.timestamp;

      applyIncomingState(
        data
      );

    }
  );

}


/* =========================================================
   Firebaseへゲーム状態送信
========================================================= */

function broadcastStateToFirebase(
  triggerBanner = false,
  bannerText = "Player Change"
) {

  if (!firebaseDb) return;

  const statePayload = {

    type:
      'STATE_SYNC',

    timestamp:
      Date.now(),

    players:
      players,

    currentTurnIndex:
      currentTurnIndex,

    remainingThrows:
      remainingThrows,

    currentRound:
      currentRound,

    maxRounds:
      maxRounds,

    hitMarkers:
      hitMarkers,

    soundConfig:
      soundConfig,

    triggerTurnBanner:
      triggerBanner,

    bannerText:
      bannerText

  };

  try {

    firebaseDb
      .ref(
        'darts_channels/' +
        getFirebaseChannelKey()
      )
      .set(
        statePayload
      );

  } catch (e) {

    console.warn(
      "Firebase sync failed:",
      e
    );

  }

}


/* =========================================================
   Firebase受信
========================================================= */

function applyIncomingState(
  data
) {

  if (!data) return;

  if (
    Array.isArray(
      data.players
    )
  ) {

    players =
      data.players;

  }

  currentTurnIndex =
    Number(
      data.currentTurnIndex || 0
    );

  remainingThrows =
    Number(
      data.remainingThrows || 0
    );

  currentRound =
    Number(
      data.currentRound || 1
    );

  maxRounds =
    Number(
      data.maxRounds || 1
    );

  hitMarkers =
    Array.isArray(
      data.hitMarkers
    )
      ? data.hitMarkers
      : [];

  if (
    data.soundConfig
  ) {

    soundConfig =
      data.soundConfig;

  }

  boardInputLocked =
    !players.length ||
    remainingThrows <= 0;

  renderInputState();

  renderOutputState();

  if (
    data.triggerTurnBanner
  ) {

    showPlayerChange();

  }

}

function loadStaffSnapshot() {

         * ゲーム側へコピーする。
         *
         * この後スタッフA/B側で
         * コインを変更しても、
         * 現在のゲームには影響しない。
         */

        applyStaffSnapshot(
          data
        );

      }
    );

/* =========================================================
   スタッフデータをゲームへコピー
========================================================= */

function applyStaffSnapshot(
  data
) {

  const ruleCoins =
    Math.max(
      1,
      Number(
        data.coinsPerThrow ||
        10
      )
    );

  const minThrows =
    Math.max(
      0,
      Number(
        data.minimumThrows ||
        0
      )
    );

  const maxThrows =
    Math.max(
      1,
      Number(
        data.maximumThrows ||
        30
      )
    );


  /*
   * 完全コピー。
   */
  staffSnapshot =
    JSON.parse(
      JSON.stringify(
        data
      )
    );


  const staffPlayers =
    Array.isArray(
      data.players
    )
      ? data.players
      : [];


  players =
    staffPlayers.map(
      player => {

        const coins =
          Math.max(
            0,
            Number(
              player.coins ||
              0
            )
          );

        const calculatedThrows =
          Math.floor(
            coins /
            ruleCoins
          );

        const throws =
          Math.min(
            maxThrows,
            Math.max(
              minThrows,
              calculatedThrows
            )
          );

        return {

          id:
            player.id ||
            (
              'p_' +
              Date.now() +
              '_' +
              Math.random()
            ),

          name:
            player.name ||
            'Player',

          coinsSnapshot:
            coins,

          score: 0,

          initialThrows:
            throws,

          remainingThrows:
            throws

        };

      }
    );


  currentTurnIndex = 0;

  currentRound = 1;

  maxRounds = 1;

  hitMarkers = [];

  boardInputLocked =
    players.length === 0 ||
    (
      players.length > 0 &&
      players[0].remainingThrows <= 0
    );

  if (
    players.length > 0
  ) {

    remainingThrows =
      players[0]
        .remainingThrows;

  } else {

    remainingThrows = 0;

  }


  broadcastStateToFirebase(
    true,
    'START'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   ゲームプレイヤー追加
========================================================= */

function addGamePlayer() {

  const name =
    prompt(
      '追加するプレイヤー名を入力してください'
    );

  if (!name) {
    return;
  }

  const throws =
    prompt(
      'このプレイヤーの投球数を入力してください',
      '3'
    );

  const throwNumber =
    Math.max(
      1,
      Number(
        throws
      ) || 3
    );

  players.push({

    id:
      'game_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2),

    name:
      name.trim(),

    coinsSnapshot: 0,

    score: 0,

    initialThrows:
      throwNumber,

    remainingThrows:
      throwNumber

  });


  if (
    players.length === 1
  ) {

    currentTurnIndex = 0;

    remainingThrows =
      throwNumber;

    boardInputLocked = false;

  }


  broadcastStateToFirebase();

  renderInputState();

  renderOutputState();

}


/* =========================================================
   プレイヤー削除
========================================================= */

function removeCurrentPlayer() {

  if (!players.length) {
    return;
  }

  const player =
    players[currentTurnIndex];

  if (!player) {
    return;
  }

  if (
    !confirm(
      player.name +
      'を削除しますか？'
    )
  ) {
    return;
  }

  players.splice(
    currentTurnIndex,
    1
  );


  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex = 0;

  }


  if (
    players.length
  ) {

    remainingThrows =
      players[currentTurnIndex]
        .remainingThrows;

    boardInputLocked =
      remainingThrows <= 0;

  } else {

    remainingThrows = 0;

    boardInputLocked = true;

  }


  broadcastStateToFirebase(
    true,
    'Player Change'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   点数リセット
========================================================= */

function resetGameScore() {

  if (
    !confirm(
      'ゲームの点数をすべてリセットしますか？'
    )
  ) {
    return;
  }


  players.forEach(
    player => {

      player.score = 0;

      player.remainingThrows =
        player.initialThrows;

    }
  );


  currentTurnIndex = 0;

  currentRound = 1;

  hitMarkers = [];


  remainingThrows =
    players.length
      ? players[0]
          .remainingThrows
      : 0;


  boardInputLocked =
    players.length === 0;


  broadcastStateToFirebase(
    true,
    'RESET'
  );

  renderInputState();

  renderOutputState();

}


/* =========================================================
   ダーツボード
========================================================= */

/*
 * 標準的なダーツボード番号配置
 *
 *              20
 *        5            1
 *     12                 18
 *   9                       4
 * 14                         13
 * 11                         6
 *  8                         10
 *  16                       15
 *     7                   2
 *        19            17
 *              3
 */

const BOARD_NUMBERS = [

  20,
  1,
  18,
  4,
  13,
  6,
  10,
  15,
  2,
  17,
  3,
  19,
  7,
  16,
  8,
  11,
  14,
  9,
  12,
  5

];


const BOARD_CENTER = 500;

const BOARD_OUTER = 455;

/*
 * 実際に得点する外周。
 */
const BOARD_SCORING_OUTER = 455;

/*
 * ダブルリング
 */
const DOUBLE_INNER = 420;

/*
 * トリプルリング
 */
const TRIPLE_OUTER = 300;
const TRIPLE_INNER = 265;

/*
 * ブル
 */
const BULL_OUTER = 70;
const BULL_INNER = 31;

const SECTOR_ANGLE =
  360 / 20;


/* =========================================================
   極座標 → SVG座標
========================================================= */

function polarPoint(
  cx,
  cy,
  radius,
  angle
) {

  const rad =
    (
      angle - 90
    ) *
    Math.PI /
    180;

  return {

    x:
      cx +
      radius *
      Math.cos(rad),

    y:
      cy +
      radius *
      Math.sin(rad)

  };

}


/* =========================================================
   セクターPATH
========================================================= */

function sectorPath(
  cx,
  cy,
  r1,
  r2,
  a1,
  a2
) {

  const p1 =
    polarPoint(
      cx,
      cy,
      r2,
      a1
    );

  const p2 =
    polarPoint(
      cx,
      cy,
      r2,
      a2
    );

  const p3 =
    polarPoint(
      cx,
      cy,
      r1,
      a2
    );

  const p4 =
    polarPoint(
      cx,
      cy,
      r1,
      a1
    );


  return [

    `M ${p1.x} ${p1.y}`,

    `A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}`,

    `L ${p3.x} ${p3.y}`,

    `A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}`,

    'Z'

  ].join(' ');

}


/* =========================================================
   SVG Element生成
========================================================= */

function createSvgElement(
  tag,
  attributes
) {

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      tag
    );

  Object.entries(
    attributes
  ).forEach(
    ([key, value]) => {

      el.setAttribute(
        key,
        value
      );

    }
  );

  return el;

}


/* =========================================================
   ダーツボード生成
========================================================= */

function buildDartboard() {

  const graphics =
    document.getElementById(
      'board-graphics'
    );

  graphics.innerHTML = '';


  const cx = BOARD_CENTER;

  const cy = BOARD_CENTER;


  /*
   * 外側の黒いフレーム
   */

  graphics.appendChild(
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          BOARD_OUTER + 18,

        fill:
          '#121212',

        stroke:
          '#2b2b2b',

        'stroke-width':
          10

      }
    )
  );


  /*
   * 外周リング
   */

  const sectorAngle =
    SECTOR_ANGLE;


  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const number =
      BOARD_NUMBERS[i];

    /*
     * 20を真上にする。
     */
    const centerAngle =
      i * sectorAngle;

    const a1 =
      centerAngle -
      sectorAngle / 2;

    const a2 =
      centerAngle +
      sectorAngle / 2;


    /*
     * 偶数番目のセクターは
     * 画像に合わせて赤系、
     * 奇数番目は緑系。
     */
    const colored =
      i % 2 === 0;


    /*
     * =====================================================
     * DOUBLE
     * =====================================================
     */

    const doublePath =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              DOUBLE_INNER,
              BOARD_SCORING_OUTER,
              a1,
              a2
            ),

          fill:
            colored
              ? '#cf2929'
              : '#218d42',

          stroke:
            '#151515',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            2,

          'data-label':
            'DOUBLE'

        }
      );


    /*
     * セクターそのものにイベントを登録。
     * SVG全体に頼らない。
     */
    doublePath.addEventListener(
      'pointerdown',
      function(event) {

        event.stopPropagation();

        registerBoardHit(
          number,
          2,
          'DOUBLE'
        );

      }
    );


    graphics.appendChild(
      doublePath
    );


    /*
     * =====================================================
     * OUTER SINGLE
     * =====================================================
     */

    const outerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              TRIPLE_OUTER,
              DOUBLE_INNER,
              a1,
              a2
            ),

          fill:
            colored
              ? '#101010'
              : '#f2f1eb',

          stroke:
            '#151515',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            1,

          'data-label':
            'SINGLE'

        }
      );


    outerSingle.addEventListener(
      'pointerdown',
      function(event) {

        event.stopPropagation();

        registerBoardHit(
          number,
          1,
          'SINGLE'
        );

      }
    );


    graphics.appendChild(
      outerSingle
    );


    /*
     * =====================================================
     * TRIPLE
     * =====================================================
     */

    const triple =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              TRIPLE_INNER,
              TRIPLE_OUTER,
              a1,
              a2
            ),

          fill:
            colored
              ? '#cf2929'
              : '#218d42',

          stroke:
            '#151515',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            3,

          'data-label':
            'TRIPLE'

        }
      );


    triple.addEventListener(
      'pointerdown',
      function(event) {

        event.stopPropagation();

        registerBoardHit(
          number,
          3,
          'TRIPLE'
        );

      }
    );


    graphics.appendChild(
      triple
    );


    /*
     * =====================================================
     * INNER SINGLE
     * =====================================================
     */

    const innerSingle =
      createSvgElement(
        'path',
        {

          d:
            sectorPath(
              cx,
              cy,
              BULL_OUTER,
              TRIPLE_INNER,
              a1,
              a2
            ),

          fill:
            colored
              ? '#101010'
              : '#f2f1eb',

          stroke:
            '#151515',

          'stroke-width':
            2,

          class:
            'board-hit',

          'data-number':
            number,

          'data-multiplier':
            1,

          'data-label':
            'SINGLE'

        }
      );


    innerSingle.addEventListener(
      'pointerdown',
      function(event) {

        event.stopPropagation();

        registerBoardHit(
          number,
          1,
          'SINGLE'
        );

      }
    );


    graphics.appendChild(
      innerSingle
    );

  }


  /*
   * =====================================================
   * OUTER BULL 25
   * =====================================================
   */

  const bull25 =
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          BULL_OUTER,

        fill:
          '#218d42',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    );


  bull25.addEventListener(
    'pointerdown',
    function(event) {

      event.stopPropagation();

      registerBoardHit(
        25,
        1,
        '25'
      );

    }
  );


  graphics.appendChild(
    bull25
  );


  /*
   * =====================================================
   * INNER BULL 50
   * =====================================================
   */

  const bull50 =
    createSvgElement(
      'circle',
      {

        cx,
        cy,

        r:
          BULL_INNER,

        fill:
          '#cf2929',

        stroke:
          '#171717',

        'stroke-width':
          2,

        class:
          'board-hit'

      }
    );


  bull50.addEventListener(
    'pointerdown',
    function(event) {

      event.stopPropagation();

      registerBoardHit(
        50,
        1,
        'BULL'
      );

    }
  );


  graphics.appendChild(
    bull50
  );


  /*
   * =====================================================
   * 番号
   * =====================================================
   */

  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const angle =
      i * sectorAngle;

    const p =
      polarPoint(
        cx,
        cy,
        478,
        angle
      );


    const text =
      createSvgElement(
        'text',
        {

          x:
            p.x,

          y:
            p.y,

          fill:
            '#f5f5f5',

          'font-size':
            48,

          'font-weight':
            900,

          'font-family':
            'Arial, Helvetica, sans-serif',

          'text-anchor':
            'middle',

          'dominant-baseline':
            'middle',

          'pointer-events':
            'none'

        }
      );


    text.textContent =
      numberToText(
        BOARD_NUMBERS[i]
      );


    graphics.appendChild(
      text
    );

  }

}


/* =========================================================
   数字表示
========================================================= */

function numberToText(
  number
) {

  return String(
    number
  );

}


/* =========================================================
   ボードクリック
========================================================= */

function registerBoardHit(
  number,
  multiplier,
  label
) {

  /*
   * 投球数がない場合は完全に無効。
   */
  if (
    boardInputLocked
  ) {

    return;

  }


  if (
    !players.length
  ) {

    return;

  }


  const player =
    players[currentTurnIndex];


  if (!player) {

    return;

  }


  /*
   * 残り投球数0なら入力禁止。
   */
  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    boardInputLocked = true;

    showPlayerChange();

    return;

  }


  const score =
    number *
    multiplier;


  registerHit(
    score,
    label
  );

}


/* =========================================================
   得点登録
========================================================= */

function registerHit(
  score,
  label
) {

  if (
    boardInputLocked
  ) {

    return;

  }


  if (
    !players.length
  ) {

    return;

  }


  const player =
    players[currentTurnIndex];


  if (!player) {

    return;

  }


  /*
   * 投球数が残っていない場合は
   * ここで完全停止。
   */
  if (
    Number(
      player.remainingThrows
    ) <= 0
  ) {

    boardInputLocked = true;

    showPlayerChange();

    return;

  }


  /*
   * 加点
   */

  player.score =
    Number(
      player.score || 0
    ) +
    Number(score);


  /*
   * 1投消費
   */

  player.remainingThrows =
    Math.max(
      0,
      Number(
        player.remainingThrows || 0
      ) - 1
    );


  remainingThrows =
    player.remainingThrows;


  /*
   * ヒット履歴
   */

  hitMarkers.push({

    score:
      score,

    label:
      label,

    playerIndex:
      currentTurnIndex,

    timestamp:
      Date.now()

  });


  /*
   * 得点演出
   */

  showHitEffect(
    score,
    label
  );


  /*
   * 音
   */

  playScoreSound();


  /*
   * =====================================================
   * 投球数を使い切った場合
   * =====================================================
   */

  if (
    player.remainingThrows <= 0
  ) {

    /*
     * これ以上ボードを押せないようにする。
     */
    boardInputLocked = true;

    broadcastStateToFirebase(
      true,
      'Player Change'
    );

    renderInputState();

    renderOutputState();

    /*
     * Player Changeを表示
     */
    showPlayerChange();


    /*
     * 少しだけ表示してから次のプレイヤーへ。
     * この間もボード入力は完全に無効。
     */
    setTimeout(
      function() {

        nextPlayer();

      },
      1300
    );

    return;

  }


  /*
   * まだ投球可能なら通常同期。
   */

  broadcastStateToFirebase();

  renderInputState();

  renderOutputState();

}


/* =========================================================
   次のプレイヤー
========================================================= */

function nextPlayer() {

  if (
    !players.length
  ) {

    boardInputLocked = true;

    return;

  }


  /*
   * 現在のプレイヤーがまだ0投なら
   * 次へ移動。
   */

  currentTurnIndex++;


  /*
   * 全員終了。
   */

  if (
    currentTurnIndex >=
    players.length
  ) {

    currentTurnIndex = 0;

    currentRound++;


    /*
     * 次ラウンド。
     *
     * 各プレイヤーに
     * 最初に決められた投球数を再設定。
     */
    players.forEach(
      player => {

        player.remainingThrows =
          player.initialThrows;

      }
    );

  }


  const nextPlayer =
    players[currentTurnIndex];


  remainingThrows =
    nextPlayer
      ? nextPlayer.remainingThrows
      : 0;


  /*
   * 次プレイヤーが投球できる状態。
   */
  boardInputLocked =
    !nextPlayer ||
    remainingThrows <= 0;


  broadcastStateToFirebase(
    true,
    'Player Change'
  );

  renderInputState();

  renderOutputState();


  /*
   * Firebaseを使わない場合にも
   * ローカル画面で確実に解除。
   */
  if (
    nextPlayer &&
    remainingThrows > 0
  ) {

    boardInputLocked = false;

  }

}


/* =========================================================
   入力画面表示
========================================================= */

function renderInputState() {

  const player =
    players[currentTurnIndex];


  document.getElementById(
    'input-current-player'
  ).textContent =
    player
      ? player.name
      : '-';


  document.getElementById(
    'input-current-score'
  ).textContent =
    player
      ? Number(
          player.score || 0
        )
      : '0';


  document.getElementById(
    'input-throw-count'
  ).textContent =
    player
      ? (
          '残り投球数：' +
          Number(
            player.remainingThrows || 0
          )
        )
      : '残り投球数：-';


  /*
   * ボードの入力状態を更新。
   */

  const board =
    document.getElementById(
      'dartboard'
    );

  if (board) {

    board.classList.toggle(
      'board-disabled',
      boardInputLocked
    );

  }

}


/* =========================================================
   出力画面表示
========================================================= */

function renderOutputState() {

  const current =
    players[currentTurnIndex];


  if (!current) {

    document.getElementById(
      'output-player-name'
    ).textContent =
      '-';

    document.getElementById(
      'output-score'
    ).textContent =
      '0';

    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：-';

  } else {

    document.getElementById(
      'output-player-name'
    ).textContent =
      current.name;

    document.getElementById(
      'output-score'
    ).textContent =
      Number(
        current.score || 0
      );

    document.getElementById(
      'output-throws'
    ).textContent =
      '残り投球数：' +
      Number(
        current.remainingThrows || 0
      );

  }


  /*
   * 現在プレイヤー以外を下側に表示。
   */

  const container =
    document.getElementById(
      'other-players'
    );

  container.innerHTML = '';


  const others =
    players.filter(
      (_, index) =>
        index !==
        currentTurnIndex
    );


  if (!others.length) {

    container.innerHTML =
      '<div class="empty-message">' +
      '他のプレイヤーはいません' +
      '</div>';

    return;

  }


  others.forEach(
    player => {

      const card =
        document.createElement(
          'div'
        );

      card.className =
        'other-player-card';


      card.innerHTML = `

        <div class="other-player-name">
          ${escapeHtml(player.name)}
        </div>

        <div class="other-player-score">
          ${Number(player.score || 0)}
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  document.getElementById(
    'current-display'
  ).classList.remove(
    'player-change'
  );

}


/* =========================================================
   得点演出
========================================================= */

function showHitEffect(
  score,
  label
) {

  const effect =
    document.getElementById(
      'hit-effect'
    );

  const inner =
    document.getElementById(
      'hit-effect-inner'
    );


  let text =
    String(score);


  if (
    label !== 'SINGLE'
  ) {

    text +=
      ' ' +
      label;

  }


  inner.textContent =
    text;


  effect.classList.remove(
    'active'
  );

  void effect.offsetWidth;

  effect.classList.add(
    'active'
  );

}


/* =========================================================
   Player Change演出
========================================================= */

function showPlayerChange() {

  const overlay =
    document.getElementById(
      'player-change-overlay'
    );


  overlay.classList.remove(
    'active'
  );

  void overlay.offsetWidth;

  overlay.classList.add(
    'active'
  );


  setTimeout(
    function() {

      overlay.classList.remove(
        'active'
      );

    },
    1300
  );

}


/* =========================================================
   出力画面のPlayer Change枠
========================================================= */

function showTurnChangeEffect() {

  const display =
    document.getElementById(
      'current-display'
    );

  if (!display) {
    return;
  }


  display.classList.remove(
    'player-change'
  );

  void display.offsetWidth;

  display.classList.add(
    'player-change'
  );

}


/* =========================================================
   MP3
========================================================= */

document
  .getElementById(
    'sound-file'
  )
  .addEventListener(
    'change',
    function() {

      const file =
        this.files &&
        this.files[0];


      if (!file) {
        return;
      }


      if (
        localSoundUrl
      ) {

        URL.revokeObjectURL(
          localSoundUrl
        );

      }


      localSoundUrl =
        URL.createObjectURL(
          file
        );


      localAudio =
        new Audio(
          localSoundUrl
        );


      localAudio.preload =
        'auto';


      soundConfig = {

        enabled: true,

        fileName:
          file.name

      };


      broadcastStateToFirebase();

    }
  );


function playScoreSound() {

  if (
    !localAudio ||
    !soundConfig.enabled
  ) {

    return;

  }


  try {

    localAudio.currentTime =
      0;

    localAudio
      .play()
      .catch(
        () => {}
      );

  } catch (e) {

    console.warn(
      'Audio playback failed:',
      e
    );

  }

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  str
) {

  return String(
    str
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttribute(
  str
) {

  return String(
    str
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /'/g,
      '&#039;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    );

}
